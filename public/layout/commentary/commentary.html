<!DOCTYPE html>
<html>
<!--
  Commentary — a re-themable SVG caster strip (Talent tab assigns up to 4
  casters from the registry; this renders the resolved commentary.{i}.* plates).

  This file is a thin shell: the look lives in the active DESIGN PACKAGE's
  theme SVG (/design/{package}/commentary.svg — picked by the global Design
  Package selector), and the rendering/data-binding lives in the reusable mount
  (commentary-mount.js). Drop this in OBS as a full-canvas (1920×1080) browser
  source, like the Lower Third — the plate row sits near the bottom.
-->
<head>
  <meta charset="utf-8" />
  <!-- The app-design knobs below apply only when the active package's theme
       opts into them (data-design-vars="app" — e.g. the Classic package);
       fixed-palette themes (Default/Rio, Slice26) ignore them. -->
  <meta name="overlay-settings" content="accentColor, cardBg, textColor, borderColor, borderRadius, borderWidth, fontFamily, cardShadow, textShadow, showShadow" />
  <!-- Rio design tokens: brand palette + display/mono webfonts used by
       fixed-palette themes (the Default package's Rajdhani/JetBrains type). -->
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    /* Inter is the app's baseline overlay font (overlay-base.js only fetches a
       font dynamically when it differs from Inter, assuming this static import).
       A theme that wants a different face should @import it inside its own SVG. */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { width: 1920px; height: 1080px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountCommentary } from '/layout/lib/commentary-mount.js';

    const host = document.getElementById('host');
    const cm = mountCommentary({ host });

    OverlayBase.init({
      render: () => cm.update(OverlayBase.state, OverlayBase.settings),
      fetchSettings: true,
      shouldRender: (key) => key.startsWith('commentary.'),
      shouldRenderSettings: (key) => key.startsWith('overlays.'),
    });

    // Reveal / hide the strip in step with OBS. Two independent signals decide
    // whether this source is actually on screen: a SCENE cut fires
    // `obsSourceActiveChanged`, while toggling the source's own visibility (the
    // eye icon) fires `obsSourceVisibleChanged`. We must honour BOTH — listening
    // only to the active event is why an eye-toggle-off never hid the plates, so
    // on the next show OBS composited their stale full-opacity frame before the
    // reveal reset them (the "full alpha, then dissolve in" stutter). Combine
    // them: on air only when neither signal says otherwise. The mount dedupes and
    // snaps hidden, so redundant/again-true events don't double the reveal.
    let obsActive, obsVisible;   // tri-state; undefined until OBS tells us
    const reconcileObs = () => cm.setActive(obsActive !== false && obsVisible !== false);
    window.addEventListener('obsSourceActiveChanged', (e) => {
      obsActive = !!(e.detail && e.detail.active); reconcileObs();
    });
    window.addEventListener('obsSourceVisibleChanged', (e) => {
      obsVisible = !!(e.detail && e.detail.visible); reconcileObs();
    });
  </script>
</body>
</html>
