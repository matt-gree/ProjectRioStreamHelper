<!DOCTYPE html>
<html lang="en">
<!--
  Simple 4-Cam Scorecard — a compact identifier card for multi-camera
  broadcasts. Bound to one scoreboard via ?scoreboard=N (default 1); shows both
  teams stacked (team logo + player name, no score) with a directional arrow so
  the card can point at the camera feed it labels.

  DIRECTION is a URL variant, not a live toggle: a 4-cam layout places several
  of these, each needing its own aim, so it can't be a per-type setting.
    ?dir=left  (default) — arrow on the left, logos left of the names, left-aligned
    ?dir=right           — mirrored: arrow on the right, logos right of the names, right-aligned

  Self-contained (like teamlogo/playername): fixed slice26 look (plum glass +
  lime/teal side bars + slice-ramp arrow), self-scales to any OBS source size.
  Native size 480×176.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="overlay-settings" content="" />
  <!-- Inter is bundled locally and injected by overlay-base.js. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow: hidden; background: transparent; }
    body { width: 480px; height: 176px; font-family: 'Inter', system-ui, sans-serif; }

    #host { width: 480px; height: 176px; transform-origin: top left; }

    .fc-card {
      width: 100%; height: 100%;
      display: flex; align-items: center; gap: 16px;
      padding: 14px 20px;
      border-radius: 20px;
      background: rgba(118, 36, 92, 0.62);
      -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 14px 44px rgba(249, 63, 145, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    /* Right-pointing mirror: arrow to the far side, rows reversed + right-aligned. */
    body[data-dir="right"] .fc-card { flex-direction: row-reverse; }

    .fc-arrow { flex: 0 0 auto; width: 46px; height: 92px; display: block; }
    body[data-dir="right"] .fc-arrow { transform: scaleX(-1); }

    .fc-rows { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .fc-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
    body[data-dir="right"] .fc-row { flex-direction: row-reverse; }

    /* Side accent bar: lime for side 1, teal for side 2 (slice26 side colours). */
    .fc-bar { flex: 0 0 auto; width: 6px; height: 52px; border-radius: 3px; }
    .fc-row.s1 .fc-bar { background: #c5f707; }
    .fc-row.s2 .fc-bar { background: #57e0e7; }

    .fc-logo { flex: 0 0 auto; width: 56px; height: 56px; object-fit: contain; }
    .fc-logo:not([src]), .fc-logo.hide { display: none; }

    .fc-name {
      flex: 1 1 auto; min-width: 0;
      font-size: 34px; font-weight: 800; line-height: 1.05; color: #ffffff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.55);
      text-align: left;
    }
    body[data-dir="right"] .fc-name { text-align: right; }
  </style>
</head>
<body>
  <div id="host">
    <div class="fc-card">
      <svg class="fc-arrow" viewBox="0 0 46 92" aria-hidden="true">
        <path d="M44 6 L10 46 L44 86 Z" fill="#ffffff"
              style="filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45))"/>
      </svg>
      <div class="fc-rows">
        <div class="fc-row s1">
          <span class="fc-bar"></span>
          <img class="fc-logo" id="logo1" alt="" />
          <span class="fc-name" id="name1"></span>
        </div>
        <div class="fc-row s2">
          <span class="fc-bar"></span>
          <img class="fc-logo" id="logo2" alt="" />
          <span class="fc-name" id="name2"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script>
    const REF_W = 480, REF_H = 176;
    document.body.dataset.refW = REF_W;
    document.body.dataset.refH = REF_H;

    function autoScale() {
      const el = document.getElementById('host');
      const needsScale = Math.abs(window.innerWidth - REF_W) > 2 || Math.abs(window.innerHeight - REF_H) > 2;
      if (needsScale) {
        const scale = Math.min(window.innerWidth / REF_W, window.innerHeight / REF_H);
        document.body.style.width = window.innerWidth + 'px';
        document.body.style.height = window.innerHeight + 'px';
        el.style.transform = `scale(${scale})`;
      } else {
        document.body.style.width = REF_W + 'px';
        document.body.style.height = REF_H + 'px';
        el.style.transform = '';
      }
    }
    window.addEventListener('resize', autoScale);
    autoScale();

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const DIR = params.get('dir') === 'right' ? 'right' : 'left';
    document.body.dataset.dir = DIR;

    const { deepGet, teamId, BASE_URL, state } = OverlayBase;

    function bindSide(t) {
      const nameEl = document.getElementById(`name${t}`);
      const logoEl = document.getElementById(`logo${t}`);
      nameEl.textContent = deepGet(state, `score.${SB}.player.${t}.rioName`, '') || '';
      // Prefer the explicit in-game banner (player.T.logo), else the roster-
      // derived team name (msb_team) — same resolution as teamlogo.html.
      const teamName = deepGet(state, `score.${SB}.player.${t}.logo`)
        || deepGet(state, `score.${SB}.player.${t}.msb_team`);
      const id = teamId(teamName);
      if (id !== undefined) {
        logoEl.classList.remove('hide');
        logoEl.onerror = () => logoEl.classList.add('hide');
        logoEl.src = `${BASE_URL}/game_assets/msb/teamLogos/${id}.png`;
      } else {
        logoEl.removeAttribute('src');
        logoEl.classList.add('hide');
      }
    }

    function render() {
      bindSide(1);
      bindSide(2);
    }

    async function boot() {
      if (OverlayBase.SAMPLE_MODE) {
        try {
          const r = await fetch(`${OverlayBase.BASE_URL}/layout/preview/scoreboard_sample.json`);
          const data = r.ok ? await r.json() : null;
          if (data) OverlayBase.deepSet(OverlayBase.state, `score.${SB}`, data);
        } catch { /* ignore */ }
      }

      OverlayBase.init({
        render,
        shouldRender: (key) => key.startsWith(`score.${SB}.player.`),
        skipState: OverlayBase.SAMPLE_MODE,
      });

      if (OverlayBase.SAMPLE_MODE) render();
    }
    boot();
  </script>
</body>
</html>
