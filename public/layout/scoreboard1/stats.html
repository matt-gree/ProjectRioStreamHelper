<!DOCTYPE html>
<html lang="en">
<!--
  Stats — a re-themable SVG stat card for the character currently batting /
  pitching on one side (?team=1|2) of a scoreboard (?scoreboard=N, default 1).

  Thin shell: the look lives in the active DESIGN PACKAGE's theme SVG
  (/design/{package}/stats.svg), the binding/transitions in
  stats-card-mount.js, the data resolution in RioData.getStatsLine. Drop into
  OBS as a 325x120 browser source.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Element knobs + the app-design knobs honored when the active package's
       theme opts into them (e.g. Classic). -->
  <meta name="overlay-settings" content="transitionType, subLine, subLineText, statValueColor, subtextColor, accentColor, cardBg, borderColor, borderWidth, fontFamily, cardShadow, textShadow" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { width: 452px; height: 118px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { mountStatsCard } from '/layout/lib/stats-card-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const TEAM = parseInt(params.get('team')) || 1;

    document.body.dataset.refW = 452;
    document.body.dataset.refH = 118;

    const host = document.getElementById('host');
    const card = mountStatsCard({ host, sb: SB, team: TEAM });

    async function boot() {
      if (OverlayBase.PREVIEW_MODE) {
        try {
          const resp = await fetch(`${OverlayBase.BASE_URL}/layout/preview/scoreboard_sample.json`);
          const data = resp.ok ? await resp.json() : null;
          if (data) OverlayBase.deepSet(OverlayBase.state, `score.${SB}`, data);
        } catch { /* ignore */ }
      }

      OverlayBase.init({
        render: () => card.update(OverlayBase.state, OverlayBase.settings),
        shouldRender: (key) => key.startsWith(`score.${SB}.`),
        shouldRenderSettings: (key) =>
          key.startsWith('overlays.stats.') || key.startsWith('overlays.global.') ||
          key.startsWith('scoreboards.'),
        fetchSettings: true,
        skipState: OverlayBase.PREVIEW_MODE,
      });

      if (OverlayBase.PREVIEW_MODE) card.update(OverlayBase.state, OverlayBase.settings);
    }
    boot();
  </script>
</body>
</html>
