<!DOCTYPE html>
<html>
<!--
  Team Logo — a thin shell over lib/teamlogo-mount.js, which is also what a
  container stands up when this element is fed into one. One side's MSB team
  banner (?scoreboard=N&team=1|2), from the user's own asset pack.
-->
<head>
  <meta charset="utf-8" />
  <meta name="overlay-settings" content="" />
  <style>
    html, body { margin: 0; overflow: hidden; }
    body { width: 360px; height: 360px; background: transparent; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountTeamLogo } from '/layout/lib/teamlogo-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const TEAM = parseInt(params.get('team')) || 1;

    document.body.dataset.refW = 360;
    document.body.dataset.refH = 360;

    const tl = mountTeamLogo({ host: document.getElementById('host'), sb: SB, team: TEAM });

    OverlayBase.init({
      render: () => tl.update(OverlayBase.state),
      sample: 'scoreboard',
      shouldRender: tl.shouldRender,
    });
  </script>
</body>
</html>
