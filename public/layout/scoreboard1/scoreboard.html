<!DOCTYPE html>
<html lang="en">
<!--
  Scoreboard — a re-themable SVG horizontal scoreboard, bound to one
  scoreboard via ?scoreboard=N (default 1) with four size variants
  (?size=xs|s|m|l; legacy xl resolves to l).

  Thin shell: the look lives in the active DESIGN PACKAGE's per-size theme SVG
  (/design/{package}/scoreboard-{size}.svg), the binding/row-stack animation in
  scoreboard-mount.js, the live data in score.{N}.*. Drop into OBS as a browser
  source at the variant's native size (the SVG scales to any source size).
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Element toggles + the app-design knobs honored when the active package's
       theme opts into them (e.g. Classic). -->
  <meta name="overlay-settings" content="showElo, showTeamLogos, showGameMode, showLogo, showLive, showInning, accentColor, cardBg, textColor, borderColor, borderWidth, fontFamily, cardShadow, textShadow, showShadow, finalBadgeColor" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* Native size hint for the largest variant; the actual body size is set
       per ?size= below (the layouts API sizes variants from _SIZE_VARIANTS). */
    body { width: 800px; height: 460px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { mountScoreboard, SIZE_DIMS } from '/layout/lib/scoreboard-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const SIZE = SIZE_DIMS[params.get('size')] ? params.get('size') : 'l';
    const dims = SIZE_DIMS[SIZE];

    // Reference dims for the Layouts-tab ScaledIframe preview detector; the
    // body holds the variant's native size (the SVG scales to fill in OBS).
    document.body.dataset.refW = dims.w;
    document.body.dataset.refH = dims.h;
    document.body.style.width = dims.w + 'px';
    document.body.style.height = dims.h + 'px';

    const host = document.getElementById('host');
    const sc = mountScoreboard({ host, sb: SB, size: SIZE });

    OverlayBase.init({
      render: () => sc.update(OverlayBase.state, OverlayBase.settings),
      sample: 'scoreboard',
      shouldRender: (key) => key.startsWith(`score.${SB}.`),
      shouldRenderSettings: (key) =>
        key.startsWith('overlays.scoreboard.') || key.startsWith('overlays.global.'),
      fetchSettings: true,
    });

    // Follow OBS's on-screen signal (scene cuts AND the source's eye icon):
    // hide snaps the board dark, show plays one clean reveal, redundant
    // activates are deduped in the mount's reveal gate.
    OverlayBase.onObsShown((shown) => sc.setShown(shown));
  </script>
</body>
</html>
