<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="overlay-settings" content="accentColor,showSuperstars,showRoleIcon,showTeamLogo,pixelPortraits,captainBox" />
  <style>
    body {
      overflow: hidden;
      margin: 0;
      width: 452px;
      height: 140px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12))
        drop-shadow(0 3px 1px rgba(0, 0, 0, 0.14))
        drop-shadow(0 1px 5px rgba(0, 0, 0, 0.12))
        drop-shadow(0 -1px 2px rgba(0, 0, 0, 0.1));
    }
    /* Grid CSS lives in roster-mount.js (injected) so it stays identical here
       and in the roster as a container member. */
  </style>
</head>
<body>
  <div class="roster-container" id="roster-container"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { renderRoster, applyRosterPalette } from '/layout/lib/roster-mount.js';
    import { ROSTER_LAYOUTS, rosterLayout } from '/layout/lib/roster-layouts.js';

    const params = new URLSearchParams(window.location.search);
    // ?layout=grid|row|column — the SOURCE's shape, and so its canvas: the
    // console resizes the OBS source to match when it switches one
    // (roster-layouts.js). Absent is the grid, at the 452x140 the body declares.
    const LAYOUT = rosterLayout(params.get('layout'));
    const REF_W = ROSTER_LAYOUTS[LAYOUT].width, REF_H = ROSTER_LAYOUTS[LAYOUT].height;
    document.body.dataset.refW = REF_W;
    document.body.dataset.refH = REF_H;
    let viewportScale = 1;
    function autoScale() {
      const el = document.getElementById('roster-container');
      const needsScale = Math.abs(window.innerWidth - REF_W) > 2 || Math.abs(window.innerHeight - REF_H) > 2;
      if (needsScale) {
        viewportScale = Math.min(window.innerWidth / REF_W, window.innerHeight / REF_H);
        document.body.style.width = window.innerWidth + 'px';
        document.body.style.height = window.innerHeight + 'px';
      } else {
        viewportScale = 1;
        document.body.style.width = REF_W + 'px';
        document.body.style.height = REF_H + 'px';
      }
      applyOuterScale(el);
    }
    function applyOuterScale(el) {
      if (!el) return;
      if (viewportScale !== 1) {
        el.style.transform = `scale(${viewportScale})`;
        el.style.transformOrigin = 'center center';
      } else {
        el.style.transform = '';
      }
    }
    window.addEventListener('resize', autoScale);
    autoScale();

    const SCOREBOARD = parseInt(params.get('scoreboard')) || 1;
    const TEAM_NUM = parseInt(params.get('team')) || 1;
    const { state, settings } = OverlayBase;

    function render() {
      const container = document.getElementById('roster-container');
      // The palette, for the captain box's --accent: the global accent, or this
      // Roster's own pin (and this side's, under Separate side styles). The
      // `accentColor` this page has always whitelisted reached nothing until a
      // part of it was drawn in the accent.
      applyRosterPalette(settings, TEAM_NUM);
      const { blank } = renderRoster(container, { state, settings, sb: SCOREBOARD, team: TEAM_NUM, layout: LAYOUT });
      OverlayBase.setBlank(blank, `Roster ${TEAM_NUM}`);
      applyOuterScale(container);
    }

    OverlayBase.init({
      render,
      sample: 'scoreboard',
      fetchSettings: true,
      shouldRender: (key) =>
        key.startsWith(`score.${SCOREBOARD}.player.${TEAM_NUM}.`)
        || key === `score.${SCOREBOARD}.half_inning`
        || key === `score.${SCOREBOARD}.home_team`
        || key === `score.${SCOREBOARD}.source_type`
        || key === `score.${SCOREBOARD}.game_completed`,
      shouldRenderSettings: (key) =>
        key.startsWith('overlays.roster.')
        || key.startsWith('overlays.global.')
        || key === 'project_rio.hud_enabled',
    });
  </script>
</body>
</html>
