<!DOCTYPE html>
<html>
<!--
  Player Name — a thin shell over lib/playername-mount.js, which is also what a
  container stands up when this element is fed into one. One side's name
  (?scoreboard=N&team=1|2) with the address-book prefix beside it; alignment and
  prefix position are authored on this element's Production stage panel.
-->
<head>
  <meta charset="utf-8" />
  <!-- The whitelist must name every knob the mount reads: the stage's Style
       section filters LAYOUT_SETTINGS.playername down to what appears here, so
       an omitted key is a setting the mount honours but nobody can reach. -->
  <meta name="overlay-settings" content="align, prefixPosition, textColor, accentColor, fontFamily, textShadow" />
  <!-- Inter is bundled locally and injected by overlay-base.js. -->
  <style>
    html, body { margin: 0; overflow: hidden; }
    body { width: 400px; height: 100px; background: transparent; }
    /* The mount scales its native card to this box, so a bigger or smaller OBS
       source resizes the name rather than cropping it. */
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountPlayerName } from '/layout/lib/playername-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const TEAM = parseInt(params.get('team')) || 1;

    document.body.dataset.refW = 400;
    document.body.dataset.refH = 100;

    const pn = mountPlayerName({ host: document.getElementById('host'), sb: SB, team: TEAM });

    OverlayBase.init({
      render: () => pn.update(OverlayBase.state, OverlayBase.settings),
      sample: 'scoreboard',
      fetchSettings: true,
      shouldRender: pn.shouldRender,
      shouldRenderSettings: pn.shouldRenderSettings,
    });
  </script>
</body>
</html>
