<!DOCTYPE html>
<html>
<!--
  Player Name — a thin shell over lib/playername-mount.js, which is also what a
  container stands up when this element is fed into one. One side's name
  (?scoreboard=N&team=1|2) with the address-book prefix beside it; the type size,
  alignment and prefix position are authored on this element's Production stage
  panel.
-->
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <!-- The whitelist must name every knob the mount reads: the stage's Style
       section filters LAYOUT_SETTINGS.playername down to what appears here, so
       an omitted key is a setting the mount honours but nobody can reach. -->
  <meta name="overlay-settings" content="nameSize, prefixSize, align, prefixPosition, textColor, accentColor, displayFont, textShadow, textStroke" />
  <!-- Inter is bundled locally and injected by overlay-base.js. -->
  <style>
    html, body { margin: 0; overflow: hidden; }
    /* The declared native size — the catalog's, the preview's and the Add
       picker's idea of this source's shape. It is a STARTING size and pure
       render headroom: the type size is the `nameSize` setting, so a bigger
       box is more room for the name to run rather than a bigger name, and the
       box only ever clamps a size that will not fit it. `refW`/`refH` below
       carry the same two numbers to the preview, which needs them to know how
       much of a scale model it is. See the header of lib/playername-mount.js. */
    body { width: 800px; height: 200px; background: transparent; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountPlayerName } from '/layout/lib/playername-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;
    const TEAM = parseInt(params.get('team')) || 1;

    document.body.dataset.refW = 800;
    document.body.dataset.refH = 200;

    const pn = mountPlayerName({ host: document.getElementById('host'), sb: SB, team: TEAM });

    OverlayBase.init({
      render: () => pn.update(OverlayBase.state, OverlayBase.settings),
      sample: 'scoreboard',
      fetchSettings: true,
      shouldRender: pn.shouldRender,
      shouldRenderSettings: pn.shouldRenderSettings,
    });
  </script>
</body>
</html>
