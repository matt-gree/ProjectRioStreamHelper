<!DOCTYPE html>
<html lang="en">
<!--
  Lower Third — a re-themable SVG broadcast band (Break phase, also placeable
  mid-game). FIVE independently toggleable SLOTS (lowerthird.slots.1..5), each
  carrying one content type: logo · match · scorebox · merch · clock · message
  · bracket. Slot widths are unequal — each type's width is owned by the theme.

  This file is a thin shell: the look lives in the active DESIGN PACKAGE's
  theme SVG (/design/{package}/lowerthird.svg — picked by the global Design
  Package selector), and the rendering/data-binding lives in the reusable mount
  (lowerthird-mount.js). Drop this in OBS as a full-canvas (1920×1080) browser
  source; the band sits at the bottom. Author it on the Production page → Break.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Knobs resolve under overlays.lowerthird.* (colour overrides). The
       Setup-tab settings panel shows a LAYOUT_SETTINGS def / global override
       only if its key appears in this whitelist. The app-design knobs (cardBg,
       fontFamily, …) apply only when the active package's theme opts into them
       (data-design-vars="app" — e.g. the Classic package). -->
  <meta name="overlay-settings" content="accentColor, cardBg, textColor, borderColor, borderRadius, borderWidth, fontFamily, cardShadow, textShadow, showShadow, port0Color, port1Color, port2Color, port3Color" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* Native full-canvas size hint; the SVG scales to whatever the OBS source is. */
    body { width: 1920px; height: 1080px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { mountLowerThird } from '/layout/lib/lowerthird-mount.js';

    const host = document.getElementById('host');
    const lt = mountLowerThird({ host });

    // Whether any enabled slot carries this content type (gates the chatty
    // score.* subscription to boards a Scorebox slot actually shows).
    const slotTypeActive = (type) => {
      const slots = OverlayBase.deepGet(OverlayBase.state, 'lowerthird.slots', {}) || {};
      return Object.values(slots).some((s) => s && s.enabled && s.type === type);
    };

    OverlayBase.init({
      render: () => lt.update(OverlayBase.state, OverlayBase.settings),
      sample: 'lowerthird',
      // Re-render when our own keys, a selected match, or branding change —
      // plus live score/bracket keys while a slot of that type is enabled.
      shouldRender: (key) => key.startsWith('lowerthird.') || key.startsWith('match.') || key.startsWith('branding')
        || (key.startsWith('score.') && slotTypeActive('scorebox'))
        || (key.startsWith('bracket') && slotTypeActive('bracket')),
      shouldRenderSettings: (key) => key.startsWith('overlays.lowerthird.') || key.startsWith('overlays.global.'),
      fetchSettings: true,
    });

    // Follow OBS's on-screen signal (scene cuts AND the source's eye icon —
    // both must be honoured, see OverlayBase.onObsShown): hide snaps the band
    // dark so no stale frame can flash on the next show; show plays one clean
    // reveal. Redundant activates (e.g. OBS's initial dispatch after load) are
    // deduped inside the mount's reveal gate.
    OverlayBase.onObsShown((shown) => lt.setShown(shown));
  </script>
</body>
</html>
