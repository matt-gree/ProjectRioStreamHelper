<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <!--
    Project Rio lower-third — the flagship re-themable theme.
    Layout: BRAND CAP · MATCH (one game) · TITLE/SUBTITLE · CLOCK.

    SLOT CONTRACT (the mount binds by data-slot; see ./README.md):
      logo           <image>  tournament logo (/branding/); hidden if none
      logo-default   <g>      Rio mushroom shown when no logo is set
      status         <text>   CURRENT / UP NEXT badge
      side1-name / side2-name <text>  player names (auto-fit to data-maxw)
      side1-sprite / side2-sprite <image>  captain headshot; hidden if none
      side1-score / side2-score <text>  optional; hidden when empty
      title          <text>   free text (auto-fit)
      subtitle       <text>   free text (auto-fit)
      clock-label    <text>   e.g. BACK IN
      clock          <text>   countdown / count-up / time-of-day (tabular)

    COLOUR: CSS variables resolve in SVG ONLY through inline style="", never via
    presentation attributes. Every themed paint below uses style="". The accent
    and per-side colour vars are overridden by the mount at runtime; the rest
    inherit from rio-theme/tokens.css. See ./README.md for the variable list.
  -->
  <defs>
    <filter id="ltGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="ltBand"><rect x="48" y="792" width="1824" height="232" rx="18"/></clipPath>
  </defs>

  <!-- soft brand glow behind the band -->
  <rect x="48" y="800" width="1824" height="232" rx="18" style="fill:var(--accent)" opacity="0.16" filter="url(#ltGlow)"/>

  <!-- band base -->
  <rect x="48" y="792" width="1824" height="232" rx="18" style="fill:var(--band)"/>
  <rect x="48" y="792" width="1824" height="232" rx="18" fill="none" style="stroke:var(--border)" stroke-width="1.5"/>

  <g clip-path="url(#ltBand)">
    <!-- accent rail + top highlight -->
    <rect x="48" y="792" width="10" height="232" style="fill:var(--accent)"/>
    <rect x="48" y="792" width="1824" height="2" fill="#ffffff" opacity="0.05"/>
    <!-- angled Rio divider after the match block (the brand "clip" edge) -->
    <polygon points="852,808 870,808 856,1008 838,1008" style="fill:var(--accent)" opacity="0.45"/>
    <!-- divider before the clock -->
    <rect x="1474" y="828" width="2" height="160" style="fill:var(--border)"/>

    <!-- ░░ BRAND CAP ░░ -->
    <image data-slot="logo" x="80" y="838" width="148" height="148" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <g data-slot="logo-default" transform="translate(6,0)">
      <!-- Mario mushroom: red cap + spots, white stem + eyes -->
      <path d="M86 905 C86 853 110 836 148 836 C186 836 210 853 210 905 Z" style="fill:var(--accent)"/>
      <circle cx="120" cy="884" r="11" fill="#ffffff"/>
      <circle cx="178" cy="888" r="8" fill="#ffffff"/>
      <circle cx="150" cy="864" r="7" fill="#ffffff"/>
      <path d="M112 905 L184 905 L184 940 C184 958 168 968 148 968 C128 968 112 958 112 940 Z" style="fill:var(--ink)"/>
      <rect x="137" y="916" width="7" height="16" rx="2" style="fill:var(--band)"/>
      <rect x="153" y="916" width="7" height="16" rx="2" style="fill:var(--band)"/>
    </g>

    <!-- ░░ MATCH (one game) ░░ -->
    <rect x="262" y="810" width="172" height="34" rx="6" style="fill:var(--accent)"/>
    <text data-slot="status" x="348" y="834" text-anchor="middle"
          style="fill:#ffffff;font-family:var(--font-display)" font-size="19" font-weight="700"
          letter-spacing="2.5">UP NEXT</text>

    <!-- side 1 row -->
    <rect x="262" y="872" width="6" height="42" style="fill:var(--side1)"/>
    <image data-slot="side1-sprite" x="280" y="868" width="50" height="50" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <text data-slot="side1-name" data-maxw="380" x="344" y="906"
          style="fill:var(--ink);font-family:var(--font-display)" font-size="34" font-weight="700">Player One</text>
    <text data-slot="side1-score" data-maxw="60" x="822" y="908" text-anchor="end"
          style="fill:var(--ink);font-family:var(--font-display)" font-size="40" font-weight="700"
          font-variant-numeric="tabular-nums" opacity="0"></text>

    <!-- side 2 row -->
    <rect x="262" y="940" width="6" height="42" style="fill:var(--side2)"/>
    <image data-slot="side2-sprite" x="280" y="936" width="50" height="50" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <text data-slot="side2-name" data-maxw="380" x="344" y="974"
          style="fill:var(--ink);font-family:var(--font-display)" font-size="34" font-weight="700">Player Two</text>
    <text data-slot="side2-score" data-maxw="60" x="822" y="976" text-anchor="end"
          style="fill:var(--ink);font-family:var(--font-display)" font-size="40" font-weight="700"
          font-variant-numeric="tabular-nums" opacity="0"></text>

    <!-- ░░ TITLE / SUBTITLE ░░ -->
    <text data-slot="title" data-maxw="568" x="902" y="902"
          style="fill:var(--ink);font-family:var(--font-display)" font-size="50" font-weight="700"
          letter-spacing="0.5">Stream Title</text>
    <text data-slot="subtitle" data-maxw="568" x="902" y="954"
          style="fill:var(--ink-dim);font-family:var(--font-body)" font-size="26" font-weight="500">Subtitle goes here</text>

    <!-- ░░ CLOCK ░░ -->
    <text data-slot="clock-label" x="1844" y="870" text-anchor="end"
          style="fill:var(--ink-dim);font-family:var(--font-display)" font-size="22" font-weight="600"
          letter-spacing="3">BACK IN</text>
    <text data-slot="clock" x="1846" y="958" text-anchor="end"
          style="fill:var(--ink);font-family:var(--font-mono)" font-size="76" font-weight="700"
          font-variant-numeric="tabular-nums">5:00</text>
  </g>
</svg>
