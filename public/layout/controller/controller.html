<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    The controller-input display, bound to a scoreboard SIDE rather than a fixed
    GameCube port. A thin shell over lib/controller-mount.js, like every other
    PRSH Layout — the mount is also what a container stands up when this element
    is fed into one.

    It wraps gc-overlay, a subprocess on its own port, on every platform — the
    reader carries a Dolphin transport for each. Its native size is gc-overlay's
    own 512x180; the page draws one SVG at that ratio and letterboxes anything
    else.
  -->
  <!-- Every LAYOUT_SETTINGS.controller key. The Style section on the
       Production stage is filtered against this list, so a key the mount reads
       but this omits is a setting nobody can reach — pinned by
       src/routes/production/stage/eventheader.test.jsx. -->
  <meta name="overlay-settings" content="labels,keyline,idleFillOpacity" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 512px; height: 180px; overflow: hidden; background: transparent; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountController, watchesSetting } from '/layout/lib/controller-mount.js';

    const params = new URLSearchParams(window.location.search);
    // team = 1 (left player) | 2 (right player), mirroring the scoreboard sides.
    // ?port=0..3 is an optional fixed override that ignores the HUD mapping.
    const ctl = mountController({
      host: document.getElementById('host'),
      sb: parseInt(params.get('scoreboard')) || 1,
      team: parseInt(params.get('team')) || 1,
      portOverride: params.has('port') ? parseInt(params.get('port')) : null,
    });

    OverlayBase.init({
      render: () => ctl.update(OverlayBase.state),
      sample: 'scoreboard',
      shouldRender: ctl.shouldRender,
      // The appearance settings are query params on the gc-overlay iframe, so
      // this source has to wake on a producer changing one — on Connections
      // (the app-wide value) or on its own stage panel (the pin).
      fetchSettings: true,
      shouldRenderSettings: watchesSetting,
    });
  </script>
</body>
</html>
