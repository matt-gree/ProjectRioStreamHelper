<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    The controller-input display, bound to a scoreboard SIDE rather than a fixed
    GameCube port. A thin shell over lib/controller-mount.js, like every other
    PRSH Layout — the mount is also what a container stands up when this element
    is fed into one.

    macOS only: it wraps gc-overlay, which reads controller state over AF_UNIX
    MemoryWatcher sockets. The layouts API omits this group off-Darwin.
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 512px; height: 256px; overflow: hidden; background: transparent; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountController } from '/layout/lib/controller-mount.js';

    const params = new URLSearchParams(window.location.search);
    // team = 1 (left player) | 2 (right player), mirroring the scoreboard sides.
    // ?port=0..3 is an optional fixed override that ignores the HUD mapping.
    const ctl = mountController({
      host: document.getElementById('host'),
      sb: parseInt(params.get('scoreboard')) || 1,
      team: parseInt(params.get('team')) || 1,
      portOverride: params.has('port') ? parseInt(params.get('port')) : null,
    });

    OverlayBase.init({
      render: () => ctl.update(OverlayBase.state),
      sample: 'scoreboard',
      shouldRender: ctl.shouldRender,
    });
  </script>
</body>
</html>
