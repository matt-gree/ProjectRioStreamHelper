<!DOCTYPE html>
<html lang="en">
<!--
  Named shared container "Stats" — a small bar sized to sit in a lower third.
  Like every shared container it hosts whatever element the producer feeds it
  (production.feed.container.stats-feed): the Stats element renders a chosen
  character's stat line; a hit could be fed here too. Rendering lives in the
  reusable element mounts (stats-mount.js / hit-mount.js); this file is just the
  sized container shell. Shares the 'stats' design settings.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="overlay-settings" content="accentColor, cardBg, borderRadius, borderColor, borderWidth, fontFamily, cardShadow, textShadow, statValueColor, subtextColor, transitionType" />
  <!-- three.js vendored locally; addons resolve bare 'three' via this map (for the hit element). -->
  <script type="importmap">
  {
    "imports": {
      "three": "/layout/lib/three/three.module.js",
      "three/addons/": "/layout/lib/three/addons/"
    }
  }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    html, body { margin: 0; height: 100%; background: transparent; overflow: visible; }
    /* Native size hint for the OBS browser source; element mounts scale to the
       source's actual size. */
    body { width: 325px; height: 120px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { initFedContainer } from '/layout/lib/fed-container.js';

    const params = new URLSearchParams(window.location.search);
    const host = document.getElementById('host');
    const PERF = params.get('perf') === '1';

    async function boot() {
      // Preview (Layouts/Setup tab): prime a representative stats assignment +
      // sample roster, and skip live state so the server can't race in over it.
      if (OverlayBase.PREVIEW_MODE) {
        try {
          const resp = await fetch(`${OverlayBase.BASE_URL}/layout/preview/scoreboard_sample.json`);
          const data = resp.ok ? await resp.json() : null;
          if (data) OverlayBase.deepSet(OverlayBase.state, 'score.1', data);
        } catch { /* ignore */ }
        OverlayBase.deepSet(OverlayBase.state, 'production.feed.container.stats-feed',
          { element: 'stats', scoreboard: 1, team: 1, charIndex: 0, role: 'batting' });
      }
      initFedContainer({ host, perf: PERF, skipState: OverlayBase.PREVIEW_MODE });
    }
    boot();
  </script>
</body>
</html>
