<!DOCTYPE html>
<html lang="en">
<!--
  Results Ticker — a re-themable SVG marquee of the bound scoreboard's
  rotation pool (?scoreboard=N, default 1).

  Thin shell: the look lives in the active DESIGN PACKAGE's theme SVG
  (/design/{package}/ticker.svg — a bar plus one prototype game card), the
  cloning/marquee in ticker-mount.js, the data in scoreboards.rotation.{N}.*.
  Drop into OBS as a 1920x80 browser source.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Ticker behavior knobs + the app-design knobs honored when the active
       package's theme opts into them (e.g. Classic). -->
  <meta name="overlay-settings" content="tickerSpeed, tickerGap, showCaptains, accentColor, cardBg, textColor, borderColor, borderWidth, fontFamily, cardShadow, textShadow, showShadow" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { width: 1920px; height: 80px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <script type="module">
    import { mountTicker } from '/layout/lib/ticker-mount.js';

    const params = new URLSearchParams(window.location.search);
    const SB = parseInt(params.get('scoreboard')) || 1;

    document.body.dataset.refW = 1920;
    document.body.dataset.refH = 80;

    const host = document.getElementById('host');
    const ticker = mountTicker({ host, sb: SB });

    async function boot() {
      if (OverlayBase.PREVIEW_MODE) {
        try {
          const resp = await fetch(`${OverlayBase.BASE_URL}/layout/preview/ticker_sample.json`);
          const games = (resp.ok ? await resp.json() : []) || [];
          const trimmed = games.slice(0, 10);
          OverlayBase.deepSet(OverlayBase.state, `scoreboards.rotation.${SB}.cached_games`, trimmed);
          OverlayBase.deepSet(OverlayBase.state, `scoreboards.rotation.${SB}.game_ids`,
            trimmed.map(g => g?.game_id).filter(Boolean));
        } catch { /* ignore — the bar stays hidden when empty */ }
      }

      OverlayBase.init({
        render: () => ticker.update(OverlayBase.state, OverlayBase.settings),
        shouldRender: (key) => key.startsWith(`scoreboards.rotation.${SB}.`),
        shouldRenderSettings: (key) =>
          key.startsWith('overlays.ticker.') || key.startsWith('overlays.global.'),
        fetchSettings: true,
        skipState: OverlayBase.PREVIEW_MODE,
      });

      if (OverlayBase.PREVIEW_MODE) ticker.update(OverlayBase.state, OverlayBase.settings);
    }
    boot();
  </script>
</body>
</html>
