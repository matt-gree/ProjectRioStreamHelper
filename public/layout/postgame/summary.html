<!DOCTYPE html>
<html lang="en">
<!--
  Game Summary — the full-screen player-vs-player end-of-game callout as its OWN
  browser source.

  Both captains with team logos, the match context (tournament · round · series)
  top-center, and the side totals (runs / hits / homeruns / stars won /
  strikeouts pitched) unfolding out of the center line.

  THIS IS THE ELEMENT'S DEDICATED SOURCE. It is also a container MEMBER: drop it
  on a container's roster (from that container's panel) when it has to share one
  full-canvas source with the Character Spotlight — which is what "these two are
  never on screen together" means — and the producer's Push decides which is up.
  On its own source there is nothing to push: the source's eye puts it on air.

  WHICH GAME: the board's capture (postgame.{N}.*). Nothing to pick — a summary
  is the whole game — so `?scoreboard=` is the only thing that scopes it, and
  with no param it is board 1, the documented default.

  This file is a thin shell: the rendering lives in postgame-vs-mount.js and the
  backdrop in the active design package (/design/{pkg}/callout.svg). Drop it in
  OBS as a 1920×1080 browser source.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Knobs resolve under overlays.postgamevs.* in the mount. -->
  <meta name="overlay-settings" content="accentColor, fontFamily" />
  <style>
    /* Inter is bundled locally (injected by overlay-base.js); only Chivo Mono is
       fetched from Google Fonts here. */
    @import url('https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@600;700;800&display=swap');
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* Native full-canvas size hint; the mount scales its 1920×1080 stage to
       whatever size the OBS source is actually set to. */
    body { width: 1920px; height: 1080px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <!-- GSAP vendored locally; the mount also lazy-loads it as a fallback. -->
  <script src="/layout/lib/gsap/gsap.min.js"></script>
  <script type="module">
    import { mountPostgameVs } from '/layout/lib/postgame-vs-mount.js';

    const params = new URLSearchParams(window.location.search);
    const host = document.getElementById('host');
    const vs = mountPostgameVs({ host });

    // No ?scoreboard= means board 1 — the board default every PRSH layout
    // documents, and the reason a source with no params is always safe.
    const urlBoard = parseInt(params.get('scoreboard'), 10);
    const board = Number.isFinite(urlBoard) ? urlBoard : 1;

    OverlayBase.init({
      render: () => vs.update(OverlayBase.state, { scoreboard: board }),
      sample: 'postgame',
      shouldRender: (key) => /^postgame\.\d+\./.test(key) || /^score\.\d+\./.test(key)
        || key.startsWith('tournamentInfo.'),
      shouldRenderSettings: (key) => key.startsWith('overlays.'),
      fetchSettings: true,
    });

    // Auto-play on a real off→on transition only; OBS also dispatches the
    // current state right after page load, and replaying on that restarts an
    // animation that has only just played on data arrival.
    let wasShown;
    OverlayBase.onObsShown((shown) => {
      if (shown && wasShown === false) vs.replay();
      wasShown = shown;
    });
  </script>
</body>
</html>
