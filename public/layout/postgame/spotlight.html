<!DOCTYPE html>
<html lang="en">
<!--
  Character Spotlight — the full-screen per-character post-game callout as its
  OWN browser source.

  Identity column (hero art, team-logo badge, H-AB premier stat, batting /
  pitching / defense boxes) around an embedded AB Theater that replays every
  plate appearance and ends holding on the spray chart.

  THIS IS THE ELEMENT'S DEDICATED SOURCE. It is also a container MEMBER: drop it
  on a container's roster (from that container's panel) when it has to share one
  source with the Game Summary, and the producer's Push decides which of them is
  up. On its own source there is nothing to push — the pick IS the content and
  the source's eye is what puts it on air.

  WHICH CHARACTER: the element's standing intent, production.feed.last.
  postgamecallout — the same pick the Production panel's content row arms and
  the same one Push would send to a container. One answer, so the panel, the
  preview and this source can never disagree about who is being spotlighted.
  `?scoreboard=` overrides the board the pick names, so a second source can
  spotlight a second board's capture.

  This file is a thin shell: the rendering lives in postgame-callout-mount.js
  and the backdrop in the active design package (/design/{pkg}/callout.svg).
  Drop it in OBS as a 1920×1080 browser source.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Knobs resolve under overlays.postgamecallout.* in the mount. -->
  <meta name="overlay-settings" content="accentColor, fontFamily" />
  <!-- The AB Theater renders trajectories through the same three.js the hit
       visualizer uses; the mount imports it by bare specifier. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/layout/lib/three/three.module.js",
      "three/addons/": "/layout/lib/three/addons/"
    }
  }
  </script>
  <style>
    /* Inter is bundled locally (injected by overlay-base.js); only Chivo Mono is
       fetched from Google Fonts here. */
    @import url('https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@600;700;800&display=swap');
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* Native full-canvas size hint; the mount scales its 1920×1080 stage to
       whatever size the OBS source is actually set to. */
    body { width: 1920px; height: 1080px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script src="/layout/lib/rio-data.js"></script>
  <!-- GSAP vendored locally; the callout mount also lazy-loads it as a fallback. -->
  <script src="/layout/lib/gsap/gsap.min.js"></script>
  <script type="module">
    import { mountPostgameCallout } from '/layout/lib/postgame-callout-mount.js';

    const params = new URLSearchParams(window.location.search);
    const host = document.getElementById('host');
    const cs = mountPostgameCallout({ host });

    // The board this source spotlights: its own URL first (a per-board source),
    // else whatever board the pick was made against. Same precedence a scoped
    // container uses — the URL says WHOSE, the intent says WHAT.
    const urlBoard = parseInt(params.get('scoreboard'), 10);

    /*
     * The pick, as a selection for the mount. `null` charIndex is a real state
     * (nothing picked yet) and the mount says so in its own blank reason rather
     * than drawing an empty stage.
     */
    function selection() {
      const last = OverlayBase.deepGet(
        OverlayBase.state, 'production.feed.last.postgamecallout', null,
      ) || {};
      return {
        scoreboard: Number.isFinite(urlBoard) ? urlBoard : (Number(last.scoreboard) || 1),
        team: Number(last.team) || 1,
        charIndex: last.charIndex,
      };
    }

    OverlayBase.init({
      render: () => cs.update(OverlayBase.state, selection()),
      /*
       * The sample bundle carries the captured game AND a pick standing in it —
       * demo mode and the console's previews have no producer pick to follow,
       * and a spotlight with nothing selected samples as a blank source.
       */
      sample: {
        file: 'postgame',
        state: {
          'production.feed.last.postgamecallout':
            { element: 'postgamecallout', scoreboard: 1, team: 1, charIndex: 0 },
        },
      },
      shouldRender: (key) => key.startsWith('production.feed.last.postgamecallout')
        || /^postgame\.\d+\./.test(key) || /^score\.\d+\./.test(key)
        || key.startsWith('tournamentInfo.'),
      shouldRenderSettings: (key) => key.startsWith('overlays.'),
      fetchSettings: true,
    });

    // Auto-play when this source comes ON screen (scene cut or the eye icon).
    // Only a real off→on transition replays: OBS dispatches the current state
    // right after page load too, and replaying on that restarts an animation
    // that has only just played on data arrival.
    let wasShown;
    OverlayBase.onObsShown((shown) => {
      if (shown && wasShown === false) cs.replay();
      wasShown = shown;
    });
  </script>
</body>
</html>
