<!DOCTYPE html>
<html lang="en">
<!--
  Upcoming Schedule — a thin shell over lib/schedule-mount.js, which is also what
  a container stands up when this element is fed into one. Renders
  `schedule.queue` with each match resolved live from `match.{M}.*`; queue
  authoring lives on the Production page.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="overlay-settings" content="accentColor, cardBg, textColor, fontFamily" />
  <link rel="stylesheet" href="/layout/lib/rio-theme/tokens.css" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { width: 1920px; height: 1080px; }
    #host { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="host"></div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/layout/lib/overlay-base.js"></script>
  <script type="module">
    import { mountSchedule } from '/layout/lib/schedule-mount.js';

    const sched = mountSchedule({ host: document.getElementById('host') });

    OverlayBase.init({
      render: () => sched.update(OverlayBase.state),
      sample: 'schedule',
      shouldRender: sched.shouldRender,
      fetchSettings: true,
    });
  </script>
</body>
</html>
