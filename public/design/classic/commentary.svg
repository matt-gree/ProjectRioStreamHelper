  <!-- CLASSIC package - Commentary: a faithful SVG port of the original CSS
       caster strip. data-design-vars="app" opts into the user's Design-tab CSS
       variables (accent, card background, font, shadows), so this theme follows
       the app's design knobs like the pre-2.0 overlays did. Full 1920x1080
       canvas, row anchored near the bottom. Plates reflow (reposition + resize,
       animated by the mount) based on how many casters are currently active,
       1-4, per public/design/README.md's data-part / layout-data contract.
       Initial markup below uses the 4-caster layout; the mount snaps to the
       real count on first paint. -->

