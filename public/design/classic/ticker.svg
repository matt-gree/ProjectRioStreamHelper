<svg viewBox="0 0 1920 80" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" data-design-vars="app">
  <!--
    CLASSIC package - Results Ticker (1920x80): the original marquee bar -
    accent RESULTS badge, translucent game cards, accent scores - painted with
    the user's Design-tab CSS variables (data-design-vars="app").
    ticker-mount.js clones card-template per game and scrolls the track.

    No mushroom field on this badge, deliberately: the drifting Rio mark is the
    DEFAULT package's signature, and this skin's whole premise is that the
    producer's own palette paints it.

    == THE BLEED, AND THE ONE ELEMENT THAT CANNOT PAY IT IN FULL =============
    See "A card's bleed is half the widest border its producer can set" in
    public/design/README.md. This bar was authored flush - 0,0,1920x80 - so
    every one of the four strokes the Border Thickness slider draws was cut in
    half against the viewBox and the rounded corners lost their outer arc
    entirely, at ANY setting including the default. This layout declares
    borderColor and borderWidth in its own overlay-settings whitelist, so that
    was a control the producer could reach and could not use.

    HORIZONTALLY IT STAYS FLUSH, and that is not the same mistake: a marquee
    spans the stream, so it runs off both sides of the frame and has no visible
    left or right edge to draw. The default package's ticker does the same.

    VERTICALLY it takes 4, not 8: the canvas is 80 and a game card is 64, so 4 is
    the whole of what is left once the cards have their padding inside the bar.
    The border is therefore whole to 8px and cropped above it - a canvas
    constraint stated out loud, not a number picked by eye.

    == THE CARD ==============================================================
    Same three rules as the default package's, for the same reasons stated at
    length there: the score plate is fixed at the card's CENTRE and the names
    anchor inward against it (so what varies with a name's length is the outer
    margin, not a hole in the middle); the captain icon is pinned to the
    MEASURED outer edge of its name; and who won is drawn with an accent rail
    plus a dim on the loser's whole row, never with a dim on the losing number
    alone. 340 -> 424 wide to pay for a score that is bigger than the names
    instead of smaller.
  -->
  <style>
    .ct-name { fill: var(--text-primary, #ffffff); font-family: var(--font-body, 'Inter', system-ui, sans-serif); text-shadow: var(--text-shadow, none); }
    /* Renamed from .ct-score when the scores grew: a value belongs in the
       numeral role, and a class whose name ends -num is held to that by
       test_a_type_class_binds_the_role_its_name_promises. The accent fill is
       this package's signature and stays. */
    .ct-num  { fill: var(--accent, #f59e0b); font-family: var(--font-mono, 'Chivo Mono', ui-monospace, monospace); font-variant-numeric: tabular-nums; }
    .ct-dim  { fill: rgba(255,255,255,0.4); font-family: var(--font-body, 'Inter', system-ui, sans-serif); }
  </style>
  <defs>
    <clipPath id="ctk-clip"><rect x="140" y="5" width="1770" height="70"/></clipPath>
    <linearGradient id="ctk-fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--card-bg, rgba(15,15,25,0.88))" stop-opacity="0"/>
      <stop offset="1" style="stop-color:var(--card-bg, rgba(15,15,25,0.88))"/>
    </linearGradient>
  </defs>

  <!-- Bar shell. ONE RECT, CARRYING ITS OWN STROKE: two rects at one geometry
       are two things that can disagree, and every other card in this package
       has been merged for the same reason. -->
  <rect x="0" y="4" width="1920" height="72" rx="12"
        style="fill:var(--card-bg, rgba(15,15,25,0.88));stroke:var(--border-color, rgba(255,255,255,0.08));stroke-width:var(--border-width, 1px);filter:var(--card-shadow-filter, none)"/>

  <!-- scrolling cards (clipped to the bar) -->
  <g clip-path="url(#ctk-clip)">
    <g data-slot="track" data-vw="1780" transform="translate(156,0)"></g>
    <rect x="1848" y="5" width="62" height="70" style="fill:url(#ctk-fade-r)"/>
  </g>

  <!-- RESULTS badge. It is the bar's own left cap, so it takes the bar's box:
       rounded on the outside, squared off into the track by the patch. -->
  <rect x="0" y="4" width="140" height="72" rx="12" style="fill:var(--accent, #f59e0b)"/>
  <rect x="112" y="4" width="28" height="72" style="fill:var(--accent, #f59e0b)"/>
  <rect x="139" y="4" width="1" height="72" fill="rgba(0,0,0,0.25)"/>
  <text x="70" y="44.5" text-anchor="middle" fill="#ffffff" font-family="var(--font-body, 'Inter', system-ui, sans-serif)" font-size="13" font-weight="800" letter-spacing="1.8">RESULTS</text>

  <!-- prototype game card (hidden; cloned + bound by the mount) -->
  <g data-slot="card-template" data-w="424" opacity="0">
    <rect data-part="card-bg" x="0" y="8" width="424" height="64" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <rect data-part="away-win" x="160" y="18" width="6" height="26" rx="3" style="fill:var(--accent, #f59e0b)" opacity="0"/>
    <rect data-part="home-win" x="258" y="18" width="6" height="26" rx="3" style="fill:var(--accent, #f59e0b)" opacity="0"/>

    <!-- Always drawn, scores or not: the fixed object the eye tracks as the
         cards go past. -->
    <rect x="166" y="16" width="92" height="30" rx="8" fill="rgba(0,0,0,0.35)"/>

    <g data-part="away-row">
      <image data-part="away-cap" x="12" y="16" width="30" height="30"
             data-pin-before="away-name" data-pin-gap="10"
             preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
      <text data-part="away-name" data-maxw="98" x="150" y="39" text-anchor="end" class="ct-name" font-size="17" font-weight="700">Away</text>
      <text data-part="score-away" x="204" y="40" text-anchor="end" class="ct-num" font-size="24" font-weight="800">0</text>
    </g>
    <g data-part="home-row">
      <image data-part="home-cap" x="382" y="16" width="30" height="30"
             data-pin-after="home-name" data-pin-gap="10"
             preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
      <text data-part="home-name" data-maxw="98" x="274" y="39" text-anchor="start" class="ct-name" font-size="17" font-weight="700">Home</text>
      <text data-part="score-home" x="220" y="40" text-anchor="start" class="ct-num" font-size="24" font-weight="800">0</text>
    </g>

    <g data-part="score-group">
      <text x="212" y="39" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="var(--font-body, 'Inter', system-ui, sans-serif)" font-size="13" font-weight="300">&#8211;</text>
    </g>
    <text data-part="vs" x="212" y="40" text-anchor="middle" class="ct-dim" font-size="14" font-weight="800" letter-spacing="1" opacity="0">VS</text>

    <text data-part="meta" data-maxw="370" x="212" y="65" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="var(--font-body, 'Inter', system-ui, sans-serif)" font-size="10.5" font-weight="700" letter-spacing="0.8" style="text-transform:uppercase">MODE &#183; DATE</text>
  </g>
</svg>
