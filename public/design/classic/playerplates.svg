    <!-- .. PLATFORM MARKS ........................................... -->
    <!-- What a bare handle can't say for itself. Drawn in the palette's text
         colour, so they sit at the value's own weight rather than advertising.
         The ids are contract - playerplates-mount.js maps an address-book subField
         onto them (SUB_GLYPHS in public/layout/lib/sub-glyph.js) - and all three
         are here together on purpose: a missing symbol shows no badge, which is
         indistinguishable from a field that wears none. -->
