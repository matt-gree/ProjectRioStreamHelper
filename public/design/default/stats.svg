<svg viewBox="0 0 452 118" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!--
    DEFAULT package - Stats bar (452x118): the per-team batter/pitcher stat
    card (stats-card-mount.js). Full roster width so the four numerals get room
    and never overlap; each value auto-fits via data-maxw. card-bg swaps between
    data-h-full and data-h-compact when the bottom line row is hidden. Fixed Rio
    palette.
  -->
  <style>
    .st-ink  { fill: var(--ink); font-family: var(--font-display); }
    .st-dim  { fill: var(--ink-dim); font-family: var(--font-display); }
    .st-num  { fill: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>

  <rect data-slot="card-bg" x="2" y="2" width="448" height="114" rx="12" data-h-full="114" data-h-compact="76" style="fill:var(--band);stroke:var(--border);stroke-width:1.5"/>

  <g data-slot="content">
    <rect x="10" y="14" width="50" height="50" rx="10" fill="rgba(255,255,255,0.045)"/>
    <rect x="10" y="14" width="3" height="50" rx="1.5" style="fill:var(--accent)"/>
    <image data-slot="char-icon" x="13" y="17" width="44" height="44" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>

    <text data-slot="stat-0-value" data-maxw="86" x="114" y="43" text-anchor="middle" class="st-num" font-size="24" font-weight="700">0</text>
    <text data-slot="stat-0-label" x="114" y="61" text-anchor="middle" class="st-dim" font-size="12" font-weight="600" letter-spacing="0.8">AB</text>
    <text data-slot="stat-1-value" data-maxw="86" x="209" y="43" text-anchor="middle" class="st-num" font-size="24" font-weight="700">.000</text>
    <text data-slot="stat-1-label" x="209" y="61" text-anchor="middle" class="st-dim" font-size="12" font-weight="600" letter-spacing="0.8">AVG</text>
    <text data-slot="stat-2-value" data-maxw="86" x="304" y="43" text-anchor="middle" class="st-num" font-size="24" font-weight="700">.000</text>
    <text data-slot="stat-2-label" x="304" y="61" text-anchor="middle" class="st-dim" font-size="12" font-weight="600" letter-spacing="0.8">SLG</text>
    <text data-slot="stat-3-value" data-maxw="86" x="399" y="43" text-anchor="middle" class="st-num" font-size="24" font-weight="700">0%</text>
    <text data-slot="stat-3-label" x="399" y="61" text-anchor="middle" class="st-dim" font-size="12" font-weight="600" letter-spacing="0.8">SO%</text>

    <g data-slot="line-group">
      <rect x="14" y="76" width="424" height="1.5" style="fill:var(--border)"/>
      <text data-slot="line-label" x="16" y="101" class="st-dim" font-size="13" font-weight="700"></text>
      <text data-slot="line-text" data-maxw="330" x="226" y="101" text-anchor="middle" class="st-num" font-size="13.5"></text>
    </g>
  </g>
</svg>
