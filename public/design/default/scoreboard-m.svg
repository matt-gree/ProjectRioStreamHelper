<svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!--
    DEFAULT package - Scoreboard M (600x200): the row-top band plus a live
    situation band (batter/pitcher, count, diamond) that swaps for an ELO/meta
    band on completed games. Row-stack contract in scoreboard-mount.js; the
    mount melds active rows into one card and sizes card-bg/card-rail.
    Fixed Rio palette; - -side1 / - -side2 come from controller ports.
  -->
  <style>
    .sb-cardbg { fill: var(--band); stroke: var(--border); stroke-width: 1.5; }
    .sb-rail   { fill: var(--accent); }
    .sb-div    { fill: var(--border); }
    .sb-ink    { fill: var(--ink); font-family: var(--font-display); }
    .sb-dim    { fill: var(--ink-dim); font-family: var(--font-body); }
    .sb-num    { fill: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .sb-mono   { fill: var(--ink-dim); font-family: var(--font-mono); }
  </style>
  <defs>
    <linearGradient id="sbm-w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--side1)" stop-opacity="0.20"/>
      <stop offset="1" style="stop-color:var(--side1)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sbm-w2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--side2)" stop-opacity="0.20"/>
      <stop offset="1" style="stop-color:var(--side2)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect data-slot="card-rail" class="sb-rail" x="8" y="6" width="6" height="188" rx="3"/>
  <rect data-slot="card-bg"  class="sb-cardbg" x="18" y="6" width="568" height="188" rx="12"/>

  <!-- ░░ TOP: names / logos / score / inning ░░ -->
  <g data-slot="row-top" data-h="78">
    <rect x="28" y="14" width="200" height="50" rx="8" style="fill:url(#sbm-w1)"/>
    <rect x="376" y="14" width="200" height="50" rx="8" style="fill:url(#sbm-w2)"/>
    <rect x="28" y="14" width="4" height="50" rx="2" style="fill:var(--side1)" opacity="0.85"/>
    <rect x="572" y="14" width="4" height="50" rx="2" style="fill:var(--side2)" opacity="0.85"/>

    <image data-slot="s1-logo" x="40" y="18" width="42" height="42" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <text data-slot="s1-name" data-maxw="132" x="90" y="47" class="sb-ink" font-size="22" font-weight="700">Player One</text>
    <image data-slot="s2-logo" x="522" y="18" width="42" height="42" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <text data-slot="s2-name" data-maxw="132" x="514" y="47" text-anchor="end" class="sb-ink" font-size="22" font-weight="700">Player Two</text>

    <text data-slot="s1-score" data-maxw="50" x="272" y="52" text-anchor="end" class="sb-num" font-size="36" font-weight="700">0</text>
    <text data-slot="s2-score" data-maxw="50" x="328" y="52" text-anchor="start" class="sb-num" font-size="36" font-weight="700">0</text>

    <g data-slot="inn-arrow-up"><polygon points="291,24 309,24 300,14" style="fill:var(--accent)"/></g>
    <g data-slot="inn-arrow-down" opacity="0"><polygon points="291,54 309,54 300,64" style="fill:var(--accent)"/></g>
    <text data-slot="inn-num" x="300" y="49" text-anchor="middle" class="sb-num" font-size="21" font-weight="700">1</text>
    <!-- The badge takes the inning's place at final, so it has to fit the gap
         the SCORES leave: they are anchored end/start at 272/328, i.e. 56 units.
         It was authored 64 wide and cut into both numbers. Sized to leave 4
         units either side, which is the clearance the L theme already has. -->
    <g data-slot="final-badge" opacity="0">
      <rect x="276" y="28" width="48" height="24" rx="5" style="fill:var(--accent)"/>
      <text x="300" y="45" text-anchor="middle" fill="#ffffff" font-family="var(--font-display)" font-size="13" font-weight="700" letter-spacing="0.5">FINAL</text>
    </g>

    <!-- Game mode: standing context, so it lives in row-top (always shown)
         rather than the completed-game row. Self-hides when unknown. -->
    <text data-slot="meta-game-mode" data-maxw="200" x="302" y="74" text-anchor="middle" class="sb-dim" font-size="10" font-weight="600" letter-spacing="0.6" opacity="0">Game Mode</text>
  </g>

  <!-- ░░ LIVE: batter / pitcher / count / diamond ░░ -->
  <g data-slot="row-live" data-h="110">
    <rect data-part="div" class="sb-div" x="28" y="0" width="548" height="1.5"/>

    <rect x="28" y="44" width="32" height="20" rx="4" style="fill:var(--accent)"/>
    <text x="44" y="59" text-anchor="middle" fill="#ffffff" font-family="var(--font-display)" font-size="12" font-weight="700">AB</text>
    <image data-slot="bat-icon" x="68" y="34" width="40" height="40" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <text data-slot="bat-name" data-maxw="106" x="116" y="60" class="sb-ink" font-size="17" font-weight="600">Batter</text>

    <!-- maxw is the budget refitText shrinks into, so it has to be REAL space:
         anchored end at 484 with the diamond now ending at 416, that is 68 units
         and 64 is the safe read. Authored at 106 it grew left THROUGH the
         diamond — "Peach" already overlapped, a long name by ~70. -->
    <text data-slot="pit-name" data-maxw="64" x="484" y="60" text-anchor="end" class="sb-ink" font-size="17" font-weight="600">Pitcher</text>
    <image data-slot="pit-icon" x="492" y="34" width="40" height="40" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <rect x="540" y="44" width="24" height="20" rx="4" style="fill:var(--side2)"/>
    <text x="552" y="59" text-anchor="middle" fill="#ffffff" font-family="var(--font-display)" font-size="12" font-weight="700">P</text>

    <!-- count: balls / strikes / outs — shifted 12 left to open the run between
         the count and the diamond, which is what pays for the pitcher's name. -->
    <text x="240" y="40" text-anchor="end" class="sb-dim" font-size="13" font-weight="700">B</text>
    <circle data-slot="ball-0" cx="258" cy="35" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="ball-1" cx="279" cy="35" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="ball-2" cx="300" cy="35" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="ball-3" cx="321" cy="35" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <text x="240" y="59" text-anchor="end" class="sb-dim" font-size="13" font-weight="700">S</text>
    <circle data-slot="strike-0" cx="258" cy="54" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="strike-1" cx="279" cy="54" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="strike-2" cx="300" cy="54" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <text x="240" y="78" text-anchor="end" class="sb-dim" font-size="13" font-weight="700">O</text>
    <circle data-slot="out-0" cx="258" cy="73" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="out-1" cx="279" cy="73" r="6.5" style="fill:rgba(255,255,255,0.08)"/>
    <circle data-slot="out-2" cx="300" cy="73" r="6.5" style="fill:rgba(255,255,255,0.08)"/>

    <!-- diamond (wide rhombus trio, 2B top / 3B left / 1B right), 0.72 of the
         authored size and recentred on 378. At full size it ran 341→449 and
         left the pitcher's name 35 units of a 106-unit budget; it now ends at
         416 with 12 units clear of the count on the other side. -->
    <polygon data-slot="base-2" points="397,38 378,48 359,38 378,28" style="fill:rgba(255,255,255,0.08);stroke:var(--border);stroke-width:1.5"/>
    <polygon data-slot="base-3" points="378,56 359,66 340,56 359,46" style="fill:rgba(255,255,255,0.08);stroke:var(--border);stroke-width:1.5"/>
    <polygon data-slot="base-1" points="416,56 397,66 378,56 397,46" style="fill:rgba(255,255,255,0.08);stroke:var(--border);stroke-width:1.5"/>
    <image data-slot="runner-2" x="369" y="29" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <image data-slot="runner-3" x="350" y="47" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
    <image data-slot="runner-1" x="388" y="47" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0"/>
  </g>

  <!-- ░░ FINAL: ELO swings + game meta (completed games) ░░ -->
  <g data-slot="row-final" data-h="110">
    <rect data-part="div" class="sb-div" x="28" y="0" width="548" height="1.5"/>

    <g data-slot="elo1-group">
      <rect x="28" y="38" width="4" height="34" rx="2" style="fill:var(--side1)" opacity="0.85"/>
      <text data-slot="elo1-in" x="42" y="62" class="sb-mono" font-size="16">1200</text>
      <text x="88" y="62" class="sb-dim" font-size="14">&#8594;</text>
      <text data-slot="elo1-out" x="104" y="62" class="sb-num" font-size="17" font-weight="700">1215</text>
      <text data-slot="elo1-delta" x="152" y="62" font-family="var(--font-mono)" font-size="14" font-weight="700">+15</text>
    </g>

    <text data-slot="meta-main" data-maxw="180" x="302" y="52" text-anchor="middle" class="sb-dim" font-size="15" font-weight="600">Stadium</text>
    <text data-slot="meta-date" x="302" y="74" text-anchor="middle" class="sb-dim" font-size="12" opacity="0.75">Date</text>

    <g data-slot="elo2-group">
      <rect x="572" y="38" width="4" height="34" rx="2" style="fill:var(--side2)" opacity="0.85"/>
      <text data-slot="elo2-in" x="470" y="62" text-anchor="end" class="sb-mono" font-size="16">1200</text>
      <text x="484" y="62" class="sb-dim" font-size="14">&#8594;</text>
      <text data-slot="elo2-out" x="540" y="62" text-anchor="end" class="sb-num" font-size="17" font-weight="700">1215</text>
      <text data-slot="elo2-delta" x="564" y="62" text-anchor="end" font-family="var(--font-mono)" font-size="14" font-weight="700">-15</text>
    </g>
  </g>
</svg>
