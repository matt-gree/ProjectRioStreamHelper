<svg viewBox="0 0 400 50" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <!--
    DEFAULT package - Scoreboard XS (400x50): the tightest strip - names,
    scores, a tiny inning marker. Single row-top band (see scoreboard-mount.js
    for the row-stack contract). Fixed Rio palette via rio-theme/tokens.css;
    the mount overrides - -side1 / - -side2 from controller ports.
  -->
  <style>
    .sb-cardbg { fill: var(--band); stroke: var(--border); stroke-width: 1.5; }
    .sb-rail   { fill: var(--accent); }
    .sb-ink    { fill: var(--ink); font-family: var(--font-display); }
    .sb-num    { fill: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>
  <defs>
    <linearGradient id="sbxs-w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--side1)" stop-opacity="0.20"/>
      <stop offset="1" style="stop-color:var(--side1)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sbxs-w2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" style="stop-color:var(--side2)" stop-opacity="0.20"/>
      <stop offset="1" style="stop-color:var(--side2)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect data-slot="card-rail" class="sb-rail" x="4" y="4" width="5" height="42" rx="2.5"/>
  <rect data-slot="card-bg"  class="sb-cardbg" x="12" y="4" width="384" height="42" rx="9"/>

  <g data-slot="row-top" data-h="42">
    <!-- side washes + port chips -->
    <rect x="18" y="10" width="140" height="30" rx="6" style="fill:url(#sbxs-w1)"/>
    <rect x="242" y="10" width="140" height="30" rx="6" style="fill:url(#sbxs-w2)"/>
    <rect x="18" y="10" width="3.5" height="30" rx="1.75" style="fill:var(--side1)" opacity="0.85"/>
    <rect x="378.5" y="10" width="3.5" height="30" rx="1.75" style="fill:var(--side2)" opacity="0.85"/>

    <text data-slot="s1-name" data-maxw="118" x="30" y="32" class="sb-ink" font-size="18" font-weight="700">Player One</text>
    <text data-slot="s2-name" data-maxw="118" x="370" y="32" text-anchor="end" class="sb-ink" font-size="18" font-weight="700">Player Two</text>

    <text data-slot="s1-score" data-maxw="34" x="182" y="34" text-anchor="end" class="sb-num" font-size="26" font-weight="700">0</text>
    <text data-slot="s2-score" data-maxw="34" x="218" y="34" text-anchor="start" class="sb-num" font-size="26" font-weight="700">0</text>

    <!-- tiny inning marker between the scores -->
    <g data-slot="inn-arrow-up"><polygon points="194,15 206,15 200,8" style="fill:var(--accent)"/></g>
    <g data-slot="inn-arrow-down" opacity="0"><polygon points="194,35 206,35 200,42" style="fill:var(--accent)"/></g>
    <text data-slot="inn-num" x="200" y="31" text-anchor="middle" class="sb-num" font-size="15" font-weight="700">1</text>
    <g data-slot="final-badge" opacity="0">
      <rect x="177" y="14" width="46" height="22" rx="5" style="fill:var(--accent)"/>
      <text x="200" y="30" text-anchor="middle" fill="#ffffff" font-family="var(--font-display)" font-size="12" font-weight="700" letter-spacing="1">FINAL</text>
    </g>
  </g>
</svg>
