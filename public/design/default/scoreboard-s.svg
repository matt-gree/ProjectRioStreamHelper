<svg viewBox="0 0 388 156" preserveAspectRatio="xMidYMid meet" data-layout="absolute" xmlns="http://www.w3.org/2000/svg">
  <!--
    DEFAULT package - Scoreboard S (388x128): a vertical two-row card (side 1 over
    side 2), HORIZONTAL-MELD absolute layout. The core (names + scores)
    is always shown; two segments toggle independently and card-bg melds its WIDTH
    to fit whichever are visible (each segment declares data-cardw = the card width
    when it is the rightmost-visible; card-bg declares data-compact-w = collapsed):
      row-inning  the inning number (arrows), swapping to final-badge on a
                  completed game. Producer toggle overlays.scoreboard.showInning
                  — but a shown live cluster forces it on, since row-live's edge
                  is outboard of it and would otherwise open a hole here.
      row-live    the live cluster (count + base diamond). Shows during play,
                  collapses on completion. Producer master overlays.scoreboard.showLive.
    Both segments carry data-anim expand-right (wipe open left to right on show,
    collapse inward on hide). side1 / side2 / accent are runtime colour seams the
    mount repaints per controller port + producer accent (literal fallbacks keep
    the departure palette when unset). Faithful translation of the designer export
    (design-sources/default/exports/scoreboard-s.svg) — positions are the author's.

    TYPE IS THE RIO TOKENS, not a literal face. The export named Inter on every
    node, so this board drew in Inter while M and L — which paint from
    the - -font-display / - -font-mono / - -font-body tokens — drew Rajdhani and
    Chivo Mono: one design package, two typefaces, split by which file you were
    looking at. Same roles as M's sb-ink / sb-num / sb-dim classes: names
    display, every numeral mono, the mode band body (which resolves to Inter, so
    that one band looks unchanged and is now saying so for a reason).
  -->
  <defs>
    <linearGradient id="sbs-w1" x1="17" y1="10" x2="187" y2="10" gradientUnits="userSpaceOnUse">
      <stop style="stop-color:var(--side1,#e53935)" stop-opacity="0.2"/>
      <stop offset="1" style="stop-color:var(--side1,#e53935)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sbs-w2" x1="19" y1="118" x2="189" y2="118" gradientUnits="userSpaceOnUse">
      <stop style="stop-color:var(--side2,#1e88e5)" stop-opacity="0.2"/>
      <stop offset="1" style="stop-color:var(--side2,#1e88e5)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect data-slot="card-bg" x="8" width="380" height="128" rx="20" data-compact-w="232" data-compact-h="128" fill="#0B0B12"/>
  <rect data-slot="card-rail" width="6" height="128" rx="3" style="fill:var(--accent,#e60012)"/>

  <!-- ░░ CORE side 1 (always shown) ░░ -->
  <g data-slot="row-top">
    <path d="M179 10H25C20.5817 10 17 13.5817 17 18V50C17 54.4183 20.5817 58 25 58H179C183.418 58 187 54.4183 187 50V18C187 13.5817 183.418 10 179 10Z" fill="url(#sbs-w1)"/>
    <path opacity="0.85" d="M21 12C21 10.8954 20.1046 10 19 10C17.8954 10 17 10.8954 17 12V56C17 57.1046 17.8954 58 19 58C20.1046 58 21 57.1046 21 56V12Z" style="fill:var(--side1,#e53935)"/>
    <image data-slot="s1-logo" x="29" y="15" width="38" height="38" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <text data-slot="s1-name" data-maxw="108" x="75" y="40.43" fill="#F5F5F8" font-family="var(--font-display, 'Rajdhani', 'Arial Narrow', sans-serif)" font-size="20" font-weight="700">Player One</text>
    <text data-slot="s1-score" data-maxw="44" x="223.63" y="44.98" text-anchor="end" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="32" font-weight="700">0</text>
  </g>

  <!-- ░░ CORE side 2 (always shown) ░░ -->
  <g data-slot="row-bottom">
    <path d="M181 118L27 118C22.5817 118 19 114.418 19 110L19 78C19 73.5817 22.5817 70 27 70L181 70C185.418 70 189 73.5817 189 78V110C189 114.418 185.418 118 181 118Z" fill="url(#sbs-w2)"/>
    <path opacity="0.85" d="M21 72C21 70.8954 20.1046 70 19 70C17.8954 70 17 70.8954 17 72V116C17 117.105 17.8954 118 19 118C20.1046 118 21 117.105 21 116V72Z" style="fill:var(--side2,#1e88e5)"/>
    <image data-slot="s2-logo" x="29" y="75" width="38" height="38" preserveAspectRatio="xMidYMid meet" opacity="0"/>
    <text data-slot="s2-name" data-maxw="108" x="75" y="100.43" fill="#F5F5F8" font-family="var(--font-display, 'Rajdhani', 'Arial Narrow', sans-serif)" font-size="20" font-weight="700">Player Two</text>
    <text data-slot="s2-score" data-maxw="44" x="223.63" y="104.98" text-anchor="end" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="32" font-weight="700">0</text>
  </g>

  <!-- ░░ GAME MODE band (toggle + content) — melds card to 156 tall ░░
       A real bottom section: data-cardh grows card-bg (and the rail with it)
       from the compact 128 to 156 when the band shows, and collapses back when
       the producer switches it off or the mode is unknown.

       Centred on the card, and the card's WIDTH melds underneath it — so the
       label can't sit at an authored x. `center=card` (data-center) hands the
       x to the mount, which drives it off the same tween as the card edge
       (scoreboard-mount centerToCard); text-anchor="middle" is what makes that
       a centre rather than a left edge. No marker bar: a rule that started at
       the plates' left inset was reading as a third row of the stack once the
       label stopped being left-aligned with them.

       16px, baseline 143: with the bar gone the band is the label's alone, and
       12px in a 38px gap (the side-2 plate's bottom edge to the card's) read as
       a footnote under the card rather than a section of it. The baseline is
       where the text's box centres in that gap — measured, not eyeballed; at
       the old y=139 a 16px label sits ~2 units high. data-maxw is sized for the
       COMPACT card (232 wide), the narrowest centre this ever has. -->
  <g data-slot="row-mode" data-cardh="156">
    <text data-slot="meta-game-mode" data-center="card" data-maxw="192" x="124" y="143" text-anchor="middle" fill="#F5F5F8" fill-opacity="0.62" font-family="var(--font-body, 'Inter', system-ui, -apple-system, sans-serif)" font-size="16" font-weight="600" letter-spacing="0.4">Game Mode</text>
  </g>

  <!-- ░░ INNING segment (toggle) — melds card to 300 ░░
       inn-num is CENTRED on the arrow cluster (250..282), not started at an x
       tuned for one glyph. It was authored in Inter WITHOUT tabular figures, so
       a start-anchored number drifted with its content — "1" sat 5 units left of
       where "9" sat, and an extra-innings "10" ran 4 units PAST the card edge.
       The slot is tabular now, but centring is still what the segment wants: a
       two-digit inning has to grow both ways from the arrows it sits between,
       not push one side into them. The segment's
       edge is 300 rather than 292 for the same reason the compact edge moved:
       at 292 the FINAL badge (which ends at 293) had 7 units of margin. -->
  <g data-slot="row-inning" data-anim="expand-right" data-cardw="300">
    <text data-slot="inn-num" data-maxw="60" x="266" y="80.47" text-anchor="middle" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="48" font-weight="700">1</text>
    <g data-slot="inn-arrow-up"><path d="M250 37H282L266 19L250 37Z" style="fill:var(--accent,#e60012)"/></g>
    <g data-slot="inn-arrow-down" opacity="0"><path d="M250 91H282L266 109L250 91Z" style="fill:var(--accent,#e60012)"/></g>
    <g data-slot="final-badge" opacity="0">
      <path d="M287.31 51H243.69C240.547 51 238 53.6863 238 57V71C238 74.3137 240.547 77 243.69 77H287.31C290.453 77 293 74.3137 293 71V57C293 53.6863 290.453 51 287.31 51Z" style="fill:var(--final-badge-color, var(--accent,#e60012))"/>
      <text x="265.5" y="69.59" text-anchor="middle" fill="#FFFFFF" font-family="var(--font-display, 'Rajdhani', 'Arial Narrow', sans-serif)" font-size="14" font-weight="700" letter-spacing="0.5">FINAL</text>
    </g>
  </g>

  <!-- ░░ LIVE segment (toggle + game-state) — melds card to full 380 ░░ -->
  <g data-slot="row-live" data-anim="expand-right" data-cardw="380">
    <text data-slot="balls" x="333.638" y="111.23" text-anchor="end" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="24" font-weight="700">0</text>
    <text x="341.44" y="109.55" text-anchor="middle" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="24" font-weight="700">-</text>
    <text data-slot="strikes" x="349.238" y="111.23" fill="#F5F5F8" font-family="var(--font-mono, 'Chivo Mono', ui-monospace, 'SF Mono', monospace)" font-variant-numeric="tabular-nums" font-size="24" font-weight="700">0</text>
    <path data-slot="out-0" d="M331.5 82C335.09 82 338 79.0899 338 75.5C338 71.9101 335.09 69 331.5 69C327.91 69 325 71.9101 325 75.5C325 79.0899 327.91 82 331.5 82Z" style="fill:rgba(255,255,255,0.08)"/>
    <path data-slot="out-1" d="M352.5 82C356.09 82 359 79.0899 359 75.5C359 71.9101 356.09 69 352.5 69C348.91 69 346 71.9101 346 75.5C346 79.0899 348.91 82 352.5 82Z" style="fill:rgba(255,255,255,0.08)"/>
    <rect data-slot="base-3" x="306" y="45.9706" width="24" height="24" transform="rotate(-45 306 45.9706)" style="fill:rgba(255,255,255,0.08)"/>
    <rect data-slot="base-2" x="325" y="26.9706" width="24" height="24" transform="rotate(-45 325 26.9706)" style="fill:rgba(255,255,255,0.08)"/>
    <rect data-slot="base-1" x="344" y="45.9706" width="24" height="24" transform="rotate(-45 344 45.9706)" style="fill:rgba(255,255,255,0.08)"/>
  </g>
</svg>
