<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
  <!-- DEFAULT package - Commentary: the Project Rio brand look (night-arena
       plates, Rio-red rail, Rajdhani display names, star-gold sub labels; from
       the Project Rio design system token layer in rio-theme/tokens.css).
       FIXED palette: no data-design-vars, so the user's Design-tab knobs never
       repaint it - raw brand hexes throughout (with token-var fallbacks where
       the shell links tokens.css). Full 1920x1080 canvas, row anchored near the
       bottom. Plates reflow to the active caster count (1-4) per
       public/design/README.md's data-part / layout-data contract; markup below
       is the 4-caster arrangement and the mount snaps to the real count on
       first paint. -->
