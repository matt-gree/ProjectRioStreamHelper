[tool.poetry]
name = "ProjectRioStreamHelper"
# Placeholder — the canonical app version is resolved at build/run time by
# scripts/freeze-version.py from the git tag (or server/_version.py for
# frozen builds). Don't bump this; tag the release instead. Poetry only
# requires the field to be present.
version = "0.0.0"
description = "Tournament scoreboard helper and overlays for Mario Superstar Baseball via Project Rio"
authors = ["João Ribeiro Bezerra <joaorb64@gmail.com>", "Isatis <isatis@foxes.gay>", "Mathias Wolfbrok <wolfy76700>", "Eion Dailey <zombiehdgaming>"]
readme = "README.md"
packages = [{include = "server"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.111.0"
httpx = {extras = ["http2"], version = "^0.28.1"}
watchfiles = ">=0.21"
loguru = "^0.7.2"
orjson = "^3.10.3"
websockets = "^12.0"
python-socketio = "^5.11.2"
uvicorn = "^0.30.1"
pillow = "^10.3.0"
pystray = "^0.19.5"
aiopath = "^0.7.7"
pandas = "^2.2.0"
requests = "^2.31.0"
numpy = "*"
jinja2 = "*"
python-multipart = "*"

[tool.poetry.group.dev.dependencies]
# Test-only deps — kept out of the frozen build (PyInstaller bundles the main
# dependency group only).
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
pytest-cov = ">=5.0"

[tool.pytest.ini_options]
# Auto mode: `async def test_*` runs without per-test decorators — almost every
# state path in this app is async.
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so tests can `import server` when run from root.
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
