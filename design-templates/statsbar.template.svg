<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 118" preserveAspectRatio="xMidYMid meet">
  <!--
    FIGMA REIMPORT TEMPLATE - statsbar (452x118). GENERATED by
    scripts/figma-template.py from the shipped public/design/default/statsbar.svg.
    Do not hand-edit this file; edit it in Figma, or regenerate it.

    Round trip: import this into Figma, restyle, export as SVG (layer names as
    ids, text NOT outlined, frame kept at exactly 452x118), then run
    scripts/compile-theme.py on the export to get an installable theme back.

    LAYER NAMES ARE THE CONTRACT. Figma keeps names, not attributes, so every
    binding the app needs rides in the layer name:
      slot=NAME            a data slot the app fills
      slot=NAME maxw=N     text that auto shrinks past N units
      part=NAME            a styling part the mount recolours
      tpl=NAME w=N         a prototype the mount clones per row
      slot=NAME hidden     a layer the APP toggles on (a FINAL badge, a runner
                           icon). Shown here so you can style it; the compiler
                           puts it back to invisible. Drop the flag and it
                           ships permanently visible.
      scaffold=NAME        editing only guide (dashed boxes), STRIPPED on compile
      layout=absolute      invisible marker carrying the root layout mode
    Keep them. Rename freely otherwise.

    RUNTIME SEAM COLOURS keep these literal hues on their layers; the compiler
    maps them back to live vars, so they repaint per controller port and per the
    producer's accent setting:
      #E53935 = side 1    #1E88E5 = side 2    #E60012 = producer accent
    Every other colour here is a fixed part of the look and is yours.

    Motion lives in the mount (JS), never in the theme file.

    Dashed boxes mark image slots (team logos, character icons). PRSH ships no
    game art, so design the BOX as the no art look; the app draws the real icon
    on top and hides it when there is none.

    STACK ROWS (slot=row-*) have been moved to the offsets the app stacks them
    to, so this file shows the assembled card rather than every band piled on
    the frame origin. `at=N` in the name records where each was put and the
    compiler takes it back out; anything you move ON TOP of that is kept. Two
    rows sharing one `at=` are ALTERNATES - a live game or a completed one,
    never both - so they are drawn overlapping on purpose. Toggle one off in
    the layers panel to work on the other, and design each to fill the band.

    CYAN DASHED BOXES (scaffold=stage-*) are the sizes this card takes at
    runtime, labelled with the row that triggers each. The card GROWS to enclose
    a segment when the app shows it, so content sitting outside the resting box
    is not misplaced - it belongs to a larger stage. Design every stage to look
    finished, and keep each stage's content inside its own box. The guides are
    editing only and never ship.
    --><!--
    DEFAULT package - Stats bar (452x118): the per-team batter/pitcher stat
    card (stats-card-mount.js). Full roster width so the four numerals get room
    and never overlap; each value auto-fits via data-maxw. card-bg swaps between
    data-h-full and data-h-compact when the bottom line row is hidden. Fixed Rio
    palette.
  -->
  <rect x="2" y="2" width="448" height="114" rx="12" fill="#0b0b12" stroke="#1f1f30" stroke-width="1.5" id="slot=card-bg hfull=114 hcompact=76" />

  <g id="slot=content">
    <rect x="10" y="14" width="50" height="50" rx="10" fill="rgba(255,255,255,0.045)" />
    <rect x="10" y="14" width="3" height="50" rx="1.5" fill="#E60012" />
    <rect id="scaffold=char-icon" x="13" y="17" width="44" height="44" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="13" y="17" width="44" height="44" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=char-icon hidden" />

    <text x="114" y="43" text-anchor="middle" font-size="24" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-0-value maxw=86">0</text>
    <text x="114" y="61" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-0-label">AB</text>
    <text x="209" y="43" text-anchor="middle" font-size="24" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-1-value maxw=86">.000</text>
    <text x="209" y="61" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-1-label">AVG</text>
    <text x="304" y="43" text-anchor="middle" font-size="24" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-2-value maxw=86">.000</text>
    <text x="304" y="61" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-2-label">SLG</text>
    <text x="399" y="43" text-anchor="middle" font-size="24" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-3-value maxw=86">0%</text>
    <text x="399" y="61" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-3-label">SO%</text>

    <g id="slot=line-group">
      <rect x="14" y="76" width="424" height="1.5" fill="#1f1f30" />
      <text x="16" y="101" font-size="13" font-weight="700" fill="#8f8fa3" font-family="Rajdhani" id="slot=line-label">LAST</text>
      <text x="226" y="101" text-anchor="middle" font-size="13.5" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=line-text maxw=330">2-run HR to left, 3 RBI</text>
    </g>
  </g>
</svg>