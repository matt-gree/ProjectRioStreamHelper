<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet">
  <!--
    FIGMA REIMPORT TEMPLATE - scoreboard-m (600x200). GENERATED by
    scripts/figma-template.py from the shipped public/design/default/scoreboard-m.svg.
    Do not hand-edit this file; edit it in Figma, or regenerate it.

    Round trip: import this into Figma, restyle, export as SVG (layer names as
    ids, text NOT outlined, frame kept at exactly 600x200), then run
    scripts/compile-theme.py on the export to get an installable theme back.

    LAYER NAMES ARE THE CONTRACT. Figma keeps names, not attributes, so every
    binding the app needs rides in the layer name:
      slot=NAME            a data slot the app fills
      slot=NAME maxw=N     text that auto shrinks past N units
      part=NAME            a styling part the mount recolours
      tpl=NAME w=N         a prototype the mount clones per row
      scaffold=NAME        editing only guide (dashed boxes), STRIPPED on compile
      layout=absolute      invisible marker carrying the root layout mode
    Keep them. Rename freely otherwise.

    RUNTIME SEAM COLOURS keep these literal hues on their layers; the compiler
    maps them back to live vars, so they repaint per controller port and per the
    producer's accent setting:
      #E53935 = side 1    #1E88E5 = side 2    #E60012 = producer accent
    Every other colour here is a fixed part of the look and is yours.

    Motion lives in the mount (JS), never in the theme file.

    Dashed boxes mark image slots (team logos, character icons). PRSH ships no
    game art, so design the BOX as the no art look; the app draws the real icon
    on top and hides it when there is none.
    --><!--
    DEFAULT package - Scoreboard M (600x200): the row-top band plus a live
    situation band (batter/pitcher, count, diamond) that swaps for an ELO/meta
    band on completed games. Row-stack contract in scoreboard-mount.js; the
    mount melds active rows into one card and sizes card-bg/card-rail.
    Fixed Rio palette; - -side1 / - -side2 come from controller ports.
  -->
  <defs>
    <linearGradient id="sbm-w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-opacity="0.20" stop-color="#E53935" />
      <stop offset="1" stop-opacity="0" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="sbm-w2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-opacity="0.20" stop-color="#1E88E5" />
      <stop offset="1" stop-opacity="0" stop-color="#1E88E5" />
    </linearGradient>
  </defs>

  <rect x="8" y="6" width="6" height="188" rx="3" fill="#E60012" id="slot=card-rail" />
  <rect x="18" y="6" width="568" height="188" rx="12" fill="#0b0b12" stroke="#1f1f30" stroke-width="1.5" id="slot=card-bg" />

  <!-- ░░ TOP: names / logos / score / inning ░░ -->
  <g id="slot=row-top h=78">
    <rect x="28" y="14" width="200" height="50" rx="8" fill="url(#sbm-w1)" />
    <rect x="376" y="14" width="200" height="50" rx="8" fill="url(#sbm-w2)" />
    <rect x="28" y="14" width="4" height="50" rx="2" opacity="0.85" fill="#E53935" />
    <rect x="572" y="14" width="4" height="50" rx="2" opacity="0.85" fill="#1E88E5" />

    <rect id="scaffold=s1-logo" x="40" y="18" width="42" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="40" y="18" width="42" height="42" preserveAspectRatio="xMidYMid meet" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=s1-logo" />
    <text x="90" y="47" font-size="22" font-weight="700" fill="#f5f5f8" font-family="Rajdhani" id="slot=s1-name maxw=132">Player One</text>
    <rect id="scaffold=s2-logo" x="522" y="18" width="42" height="42" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="522" y="18" width="42" height="42" preserveAspectRatio="xMidYMid meet" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=s2-logo" />
    <text x="514" y="47" text-anchor="end" font-size="22" font-weight="700" fill="#f5f5f8" font-family="Rajdhani" id="slot=s2-name maxw=132">Player Two</text>

    <text x="272" y="52" text-anchor="end" font-size="36" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=s1-score maxw=50">0</text>
    <text x="328" y="52" text-anchor="start" font-size="36" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=s2-score maxw=50">0</text>

    <g id="slot=inn-arrow-up"><polygon points="291,24 309,24 300,14" fill="#E60012" /></g>
    <g opacity="0" id="slot=inn-arrow-down"><polygon points="291,54 309,54 300,64" fill="#E60012" /></g>
    <text x="300" y="49" text-anchor="middle" font-size="21" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=inn-num">1</text>
    <!-- The badge takes the inning's place at final, so it has to fit the gap
         the SCORES leave: they are anchored end/start at 272/328, i.e. 56 units.
         It was authored 64 wide and cut into both numbers. Sized to leave 4
         units either side, which is the clearance the L theme already has. -->
    <g opacity="0" id="slot=final-badge">
      <rect x="276" y="28" width="48" height="24" rx="5" fill="#E60012" />
      <text x="300" y="45" text-anchor="middle" fill="#ffffff" font-family="Rajdhani" font-size="13" font-weight="700" letter-spacing="0.5">FINAL</text>
    </g>

    <!-- Game mode: standing context, so it lives in row-top (always shown)
         rather than the completed-game row. Self-hides when unknown. -->
    <text x="302" y="74" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.6" opacity="0" fill="#8f8fa3" font-family="Inter" id="slot=meta-game-mode maxw=200">Game Mode</text>
  </g>

  <!-- ░░ LIVE: batter / pitcher / count / diamond ░░ -->
  <g id="slot=row-live h=110">
    <rect x="28" y="0" width="548" height="1.5" fill="#1f1f30" id="part=div" />

    <rect x="28" y="44" width="32" height="20" rx="4" fill="#E60012" />
    <text x="44" y="59" text-anchor="middle" fill="#ffffff" font-family="Rajdhani" font-size="12" font-weight="700">AB</text>
    <rect id="scaffold=bat-icon" x="68" y="34" width="40" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="68" y="34" width="40" height="40" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=bat-icon" />
    <text x="116" y="60" font-size="17" font-weight="600" fill="#f5f5f8" font-family="Rajdhani" id="slot=bat-name maxw=106">Batter</text>

    <!-- maxw is the budget refitText shrinks into, so it has to be REAL space:
         anchored end at 484 with the diamond now ending at 416, that is 68 units
         and 64 is the safe read. Authored at 106 it grew left THROUGH the
         diamond — "Peach" already overlapped, a long name by ~70. -->
    <text x="484" y="60" text-anchor="end" font-size="17" font-weight="600" fill="#f5f5f8" font-family="Rajdhani" id="slot=pit-name maxw=64">Pitcher</text>
    <rect id="scaffold=pit-icon" x="492" y="34" width="40" height="40" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="492" y="34" width="40" height="40" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=pit-icon" />
    <rect x="540" y="44" width="24" height="20" rx="4" fill="#1E88E5" />
    <text x="552" y="59" text-anchor="middle" fill="#ffffff" font-family="Rajdhani" font-size="12" font-weight="700">P</text>

    <!-- count: balls / strikes / outs — shifted 12 left to open the run between
         the count and the diamond, which is what pays for the pitcher's name. -->
    <text x="240" y="40" text-anchor="end" font-size="13" font-weight="700" fill="#8f8fa3" font-family="Inter">B</text>
    <circle cx="258" cy="35" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=ball-0" />
    <circle cx="279" cy="35" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=ball-1" />
    <circle cx="300" cy="35" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=ball-2" />
    <circle cx="321" cy="35" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=ball-3" />
    <text x="240" y="59" text-anchor="end" font-size="13" font-weight="700" fill="#8f8fa3" font-family="Inter">S</text>
    <circle cx="258" cy="54" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=strike-0" />
    <circle cx="279" cy="54" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=strike-1" />
    <circle cx="300" cy="54" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=strike-2" />
    <text x="240" y="78" text-anchor="end" font-size="13" font-weight="700" fill="#8f8fa3" font-family="Inter">O</text>
    <circle cx="258" cy="73" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=out-0" />
    <circle cx="279" cy="73" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=out-1" />
    <circle cx="300" cy="73" r="6.5" fill="rgba(255,255,255,0.08)" id="slot=out-2" />

    <!-- diamond (wide rhombus trio, 2B top / 3B left / 1B right), 0.72 of the
         authored size and recentred on 378. At full size it ran 341→449 and
         left the pitcher's name 35 units of a 106-unit budget; it now ends at
         416 with 12 units clear of the count on the other side. -->
    <polygon points="397,38 378,48 359,38 378,28" fill="rgba(255,255,255,0.08)" stroke="#1f1f30" stroke-width="1.5" id="slot=base-2" />
    <polygon points="378,56 359,66 340,56 359,46" fill="rgba(255,255,255,0.08)" stroke="#1f1f30" stroke-width="1.5" id="slot=base-3" />
    <polygon points="416,56 397,66 378,56 397,46" fill="rgba(255,255,255,0.08)" stroke="#1f1f30" stroke-width="1.5" id="slot=base-1" />
    <rect id="scaffold=runner-2" x="369" y="29" width="18" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="369" y="29" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=runner-2" />
    <rect id="scaffold=runner-3" x="350" y="47" width="18" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="350" y="47" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=runner-3" />
    <rect id="scaffold=runner-1" x="388" y="47" width="18" height="18" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="388" y="47" width="18" height="18" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=runner-1" />
  </g>

  <!-- ░░ FINAL: ELO swings + game meta (completed games) ░░ -->
  <g id="slot=row-final h=110">
    <rect x="28" y="0" width="548" height="1.5" fill="#1f1f30" id="part=div" />

    <g id="slot=elo1-group">
      <rect x="28" y="38" width="4" height="34" rx="2" opacity="0.85" fill="#E53935" />
      <text x="42" y="62" font-size="16" fill="#8f8fa3" font-family="Chivo Mono" id="slot=elo1-in">1200</text>
      <text x="88" y="62" font-size="14" fill="#8f8fa3" font-family="Inter">→</text>
      <text x="104" y="62" font-size="17" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=elo1-out">1215</text>
      <text x="152" y="62" font-family="Chivo Mono" font-size="14" font-weight="700" id="slot=elo1-delta">+15</text>
    </g>

    <text x="302" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#8f8fa3" font-family="Inter" id="slot=meta-main maxw=180">Stadium</text>
    <text x="302" y="74" text-anchor="middle" font-size="12" opacity="0.75" fill="#8f8fa3" font-family="Inter" id="slot=meta-date">Date</text>

    <g id="slot=elo2-group">
      <rect x="572" y="38" width="4" height="34" rx="2" opacity="0.85" fill="#1E88E5" />
      <text x="470" y="62" text-anchor="end" font-size="16" fill="#8f8fa3" font-family="Chivo Mono" id="slot=elo2-in">1200</text>
      <text x="484" y="62" font-size="14" fill="#8f8fa3" font-family="Inter">→</text>
      <text x="540" y="62" text-anchor="end" font-size="17" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=elo2-out">1215</text>
      <text x="564" y="62" text-anchor="end" font-family="Chivo Mono" font-size="14" font-weight="700" id="slot=elo2-delta">-15</text>
    </g>
  </g>
</svg>