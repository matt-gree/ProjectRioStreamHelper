<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 294" preserveAspectRatio="xMidYMid meet">
  <!--
    FIGMA REIMPORT TEMPLATE - statscard (380x294). GENERATED by
    scripts/figma-template.py from the shipped public/design/default/statscard.svg.
    Do not hand-edit this file; edit it in Figma, or regenerate it.

    Round trip: import this into Figma, restyle, export as SVG (layer names as
    ids, text NOT outlined, the whole canvas exported as-is), then run
    scripts/compile-theme.py on the export to get an installable theme back.
    

    LAYER NAMES ARE THE CONTRACT. Figma keeps names, not attributes, so every
    binding the app needs rides in the layer name:
      slot=NAME            a data slot the app fills
      slot=NAME maxw=N     text that auto shrinks past N units
      part=NAME            a styling part the mount recolours
      tpl=NAME w=N         a prototype the mount clones per row
      slot=NAME hidden     a layer the APP toggles on (a FINAL badge, a runner
                           icon). Shown here so you can style it; the compiler
                           puts it back to invisible. Drop the flag and it
                           ships permanently visible.
      scaffold=NAME        editing only guide (dashed boxes), STRIPPED on compile
      layout=absolute      invisible marker carrying the root layout mode
      frame=WxH            invisible marker: the element's native size
      at=X,Y               where this file PLACED a layer for editing; the
                           compiler takes it back out (a nudge on top is kept)
      defs                 a prototype the app keeps in <defs>; lifted onto the
                           canvas so you can see it, put back on compile
    Keep them. Rename freely otherwise.

    RUNTIME SEAM COLOURS keep these literal hues on their layers; the compiler
    maps them back to live vars, so they repaint per controller port and per the
    producer's accent setting:
      #E53935 = side 1    #1E88E5 = side 2    #E60012 = producer accent
    Every other colour here is a fixed part of the look and is yours.

    Motion lives in the mount (JS), never in the theme file.

    Dashed boxes mark image slots (team logos, character icons). PRSH ships no
    game art, so design the BOX as the no art look; the app draws the real icon
    on top and hides it when there is none.

    PREVIEW COPIES (scaffold=preview-*) show the slots a prototype is cloned
    into at runtime (ticker cards, schedule rows) and the rest of the card
    around an alternate. They are COPIES: they do not follow your edits and are
    stripped on compile. Edit the original (the slot=/tpl= layer) and check
    the spacing against the copies.

    STACK ROWS (slot=row-* / slot=el-*) have been moved to the offsets the app stacks them
    to, so this file shows the assembled card rather than every band piled on
    the frame origin. `at=N` in the name records where each was put and the
    compiler takes it back out; anything you move ON TOP of that is kept.
    ALTERNATES - rows the app never shows together (a live game or a completed
    one; the Scorecard's full / rosters / condensed score block) - each get a
    column of their own beside the frame, with the rest of the card previewed
    around them. Design each to fill the same band.

    CYAN DASHED BOXES (scaffold=stage-*) are the sizes this card takes at
    runtime, labelled with the row that triggers each. The card GROWS to enclose
    a segment when the app shows it, so content sitting outside the resting box
    is not misplaced - it belongs to a larger stage. Design every stage to look
    finished, and keep each stage's content inside its own box. The guides are
    editing only and never ship.
    --><!--
    DEFAULT package - Stat CARD (landscape, 380x294): the compact 2x2 stat card
    used by the combined Roster + Stats element (rosterstats-mount.js) and by the
    Stat Card container member, both via stats-card-mount.js with
    svgElement:'statscard'. Character icon on the LEFT in a soft well with an
    accent rail; a 2x2 grid of value/label cells (roomy row spacing) spread
    across the right; an optional header caption above it and an optional caption
    line below it. Values/labels are bound by the mount from RioData.getStatsLine
    - batting: AB / AVG over SLG / SO%; pitching: IP / ERA over K% / AVG.

    THIS CARD IS default/statsbar.svg AT A DIFFERENT ASPECT. Same band, same
    border, same well and accent rail, same Rajdhani labels, same numeral face -
    it is the four-across stats bar folded into two rows because it has to sit
    inside a container slot rather than across a roster's width. A producer
    running the Stat Bar source in one scene and the Stat Card member in another
    is looking at one object, so the two files stay in step: change one, look at
    the other.

    Fixed RIO palette from rio-theme/tokens.css (no data-design-vars, so the
    Design-tab knobs never repaint it). The card before this one was drawn in
    Slice 26's plum glass; that design now lives in the slice26 package, which is
    where its palette came from.

    EVERY var() CARRIES A LITERAL FALLBACK, and that is not decoration. An
    unresolved custom property in a presentation style computes to the property's
    initial value - black fill, black stroke - so a card whose shell forgot the
    token layer renders as a black rectangle with black text on it, silently.
    That is exactly what shipped for a few minutes on the container shell
    (shared/container.html now links the tokens; the fallbacks are the belt).

    NO ATMOSPHERE FIELD, unlike the default lower third / plates / matchup. This
    card cross-fades on every batter change, many times a game, and its height is
    almost entirely numerals - a drifting field would be paying a per-frame
    raster cost to decorate the one card that redraws most and has the least room
    to hide a mark behind. Depth here comes from the well and rail.

    == TWO MOVING EDGES ======================================================
    The stat block NEVER MOVES. Both captions are optional, and rather than
    reflow the card around them, each one owns an edge: turning the header on
    moves the card's TOP edge up over a band that is already drawn there, and
    turning the footer on moves its BOTTOM edge down. card-bg declares all four
    positions and the mount animates between them (0.45s power3.out, the
    scorecard's easing):

      data-top-open    2    header shown, card opens over the header band
      data-top-closed  30   header hidden, 28 units of padding above the well
      data-bot-open    238  footer shown
      data-bot-closed  206  footer hidden, the same 28 units below the well

    So all four combinations come from one pair of edges rather than four
    authored layouts, and a card with both captions off is exactly the card that
    shipped before they existed.

    == THE ROSTER IS A THIRD BAND, BELOW THE FOOTER ==========================
    Optional (the producer's Roster switch), and it owns the bottom edge when it
    is on: the side's nine in a row at 30 units on a 38 pitch, the captain in
    an accent ring the mount parks around its slot (the Scoreboard L's roster
    ring, the same idiom). Authored where it sits UNDER an open footer; with
    the footer closed the mount lifts the band by data-dy-closed so its rule
    lands where the footer's would (189.25). card-bg declares the bottom edge
    for both cases:

      data-roster-open    292  roster under an open footer
      data-roster-closed  244  roster straight under the stats

    The canvas grew 240 -> 294 to hold it; with the roster off the card ends
    where it always did and the extra 54 units are transparent. (data-h-full / data-h-compact are still honoured
    for a theme that declares only a footer, which is how slice26's card,
    authored before the header existed, keeps working.)

    28 UNITS IS THE CARD'S PADDING CONSTANT on a closed edge; on an open one the
    divider sits about 12 from the well and the caption is centred in the band
    below/above it. The header is the smaller voice of the two - 19px display
    caps against the footer's 23px body - because it names the stat set ("Stars
    On Showdown XXI Stats") while the footer carries the live line, and a title
    that outweighs the live number is the wrong way round.

    THE FOOTER LINE IS LEFT-ALIGNED BESIDE ITS LABEL, and that is what makes it
    big. Centred, it could claim only 244 of the band's 340 units: a centred
    line grows out from the middle in BOTH directions, so it has to clear the
    "Game" label ending at x=58 on one side and reserve the same width it will
    never use on the other (190 - 244/2 = 68). Running left to right from x=68
    to the band's right edge it gets 292 — and the reserve disappears entirely
    when there is no label, where it starts at 20 and gets 340.

    The label is not always there: `line-label` is bound only for a HUD game's
    line, while an API board's "Tournament Stats" arrives as the line ITSELF. So
    line-text authors BOTH left edges (data-x-labelled / data-x-bare) against one
    right bound (data-maxr) and the mount picks — the same shape as the four card
    edges above. Measured at 23px Inter 700: "1-for-5, 2B" is 119 units and a
    heavy batting line ("3-for-5, 2B, HR, 4 RBI, 2 SB") 304, which now auto-fits
    to 22 where centred it came down to 18.5. The header has no label beside it,
    so it keeps the full 330, centred.

    THE FOUR VALUES ARE MONO AND THE LINE BENEATH THEM IS NOT, and that is the
    whole distinction `stc-num` and `stc-cap` exist to draw. A stat VALUE is a
    tabular number in a fixed cell, so it takes the numeral face; the footer
    LINE is a sentence that happens to contain numbers, so it takes the body
    face. Measured at weight 700, Chivo Mono's digit is 0.600em against Inter's
    0.6465em *with tabular-nums* - which these classes have to set either way,
    so Inter never gets to spend its narrow `1` - and its `%` is 0.600 against
    Inter's 1.0156. The decimal point is the one glyph mono loses on (+0.33em),
    and it lands once per value against a `%` saving of 0.42: in this card's
    106-wide cell at 34px, "25.0%" is 102 in Chivo and 110 in Inter, so the
    numeral face is what keeps a percentage off the auto-fit. On the LINE the
    arithmetic inverts, because a sentence is mostly letters: the heavy case
    above is 296 units in Inter and 386 in Chivo, which auto-fits to 15px
    instead of 19. Same reasoning, opposite answer; don't unify them.
  -->
  <!-- Card. Authored in its commonest state: header off, footer on. -->
  <rect x="2" y="30" width="376" height="208" rx="16" fill="#0b0b12" stroke="#1f1f30" stroke-width="1.5" id="slot=card-bg hfull=208 hcompact=176 topopen=2 topclosed=30 botopen=238 botclosed=206 rosteropen=292 rosterclosed=244" />

  <g id="slot=content">
    <!-- Header caption: band 2..44.25, caption centred on a 30 baseline -->
    <g opacity="1" id="slot=head-group hidden">
      <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="0.6" fill="#f5f5f8" font-family="Rajdhani" id="slot=head-text maxw=330 xlabelled=20 xbare=20 maxr=360">Head Text</text>
      <rect x="20" y="44.25" width="340" height="1.5" fill="#1f1f30" />
    </g>

    <!-- Character icon (left) in a soft well with an accent rail -->
    <rect x="20" y="58" width="110" height="120" rx="14" fill="rgba(255,255,255,0.045)" />
    <rect x="20" y="58" width="4" height="120" rx="2" fill="#E60012" />
    <rect id="scaffold=char-icon" x="29" y="70" width="96" height="96" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="29" y="70" width="96" height="96" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=char-icon hidden" />

    <!-- 2x2 grid dividers -->
    <rect x="257.25" y="62" width="1.5" height="116" fill="#1f1f30" />
    <rect x="150" y="117.25" width="222" height="1.5" fill="#1f1f30" />

    <!-- Row 1: top-left / top-right -->
    <text x="204" y="88" text-anchor="middle" font-size="34" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-0-value maxw=106">0</text>
    <text x="204" y="106" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-0-label">AB</text>
    <text x="316" y="88" text-anchor="middle" font-size="34" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-1-value maxw=106">.000</text>
    <text x="316" y="106" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-1-label">AVG</text>

    <!-- Row 2: bottom-left / bottom-right -->
    <text x="204" y="158" text-anchor="middle" font-size="34" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-2-value maxw=106">.000</text>
    <text x="204" y="176" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-2-label">SLG</text>
    <text x="316" y="158" text-anchor="middle" font-size="34" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="slot=stat-3-value maxw=106">0%</text>
    <text x="316" y="176" text-anchor="middle" font-size="16" font-weight="600" letter-spacing="0.8" fill="#8f8fa3" font-family="Rajdhani" id="slot=stat-3-label">SO%</text>

    <!-- Footer caption / game line: band 190.75..238, on a 222 baseline -->
    <g id="slot=line-group">
      <rect x="20" y="189.25" width="340" height="1.5" fill="#1f1f30" />
      <text x="20" y="222" font-size="16" font-weight="600" fill="#8f8fa3" font-family="Rajdhani" id="slot=line-label">LAST</text>
      <text x="68" y="222" font-size="23" font-weight="700" fill="#f5f5f8" font-family="Inter" id="slot=line-text maxw=292 xlabelled=68 xbare=20 maxr=360">2-run HR to left, 3 RBI</text>
    </g>

    <!-- Roster band: rule on the footer's bottom edge, nine at 30 on a 38 pitch
         across the 20..360 content width, the captain ringed. -->
    <g opacity="1" id="slot=roster-group dyclosed=-48 hidden">
      <rect x="20" y="237.25" width="340" height="1.5" fill="#1f1f30" />
      <rect x="20" y="247" width="36" height="36" rx="8" fill="none" opacity="1" stroke="#E60012" stroke-width="2" id="slot=roster-cap-ring pad=3 hidden" />
      <rect id="scaffold=roster-char-0" x="23" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="23" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-0 hidden" />
      <rect id="scaffold=roster-char-1" x="61" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="61" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-1 hidden" />
      <rect id="scaffold=roster-char-2" x="99" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="99" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-2 hidden" />
      <rect id="scaffold=roster-char-3" x="137" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="137" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-3 hidden" />
      <rect id="scaffold=roster-char-4" x="175" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="175" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-4 hidden" />
      <rect id="scaffold=roster-char-5" x="213" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="213" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-5 hidden" />
      <rect id="scaffold=roster-char-6" x="251" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="251" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-6 hidden" />
      <rect id="scaffold=roster-char-7" x="289" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="289" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-7 hidden" />
      <rect id="scaffold=roster-char-8" x="327" y="250" width="30" height="30" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="327" y="250" width="30" height="30" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="1" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=roster-char-8 hidden" />
