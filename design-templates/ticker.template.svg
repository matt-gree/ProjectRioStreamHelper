<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 80" preserveAspectRatio="xMidYMid meet">
  <!--
    FIGMA REIMPORT TEMPLATE - ticker (1920x80). GENERATED by
    scripts/figma-template.py from the shipped public/design/default/ticker.svg.
    Do not hand-edit this file; edit it in Figma, or regenerate it.

    Round trip: import this into Figma, restyle, export as SVG (layer names as
    ids, text NOT outlined, frame kept at exactly 1920x80), then run
    scripts/compile-theme.py on the export to get an installable theme back.

    LAYER NAMES ARE THE CONTRACT. Figma keeps names, not attributes, so every
    binding the app needs rides in the layer name:
      slot=NAME            a data slot the app fills
      slot=NAME maxw=N     text that auto shrinks past N units
      part=NAME            a styling part the mount recolours
      tpl=NAME w=N         a prototype the mount clones per row
      scaffold=NAME        editing only guide (dashed boxes), STRIPPED on compile
      layout=absolute      invisible marker carrying the root layout mode
    Keep them. Rename freely otherwise.

    RUNTIME SEAM COLOURS keep these literal hues on their layers; the compiler
    maps them back to live vars, so they repaint per controller port and per the
    producer's accent setting:
      #E53935 = side 1    #1E88E5 = side 2    #E60012 = producer accent
    Every other colour here is a fixed part of the look and is yours.

    Motion lives in the mount (JS), never in the theme file.

    Dashed boxes mark image slots (team logos, character icons). PRSH ships no
    game art, so design the BOX as the no art look; the app draws the real icon
    on top and hides it when there is none.
    --><!--
    DEFAULT package - Results Ticker (1920x80): the Rio marquee bar. A RESULTS
    badge pins the left edge; ticker-mount.js clones the card-template once per
    game into the track group and scrolls it. Template card width is declared
    via data-w; the track's visible width via data-vw. Fixed Rio palette.
  -->
  <defs>
    <clipPath id="tk-clip"><rect x="150" y="5.5" width="1758" height="69" /></clipPath>
    <linearGradient id="tk-fade-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-opacity="0" stop-color="#0b0b12" />
      <stop offset="1" stop-opacity="1" stop-color="#0b0b12" />
    </linearGradient>
  </defs>

  <!-- bar shell -->
  <rect x="0" y="4" width="1920" height="72" rx="12" fill="#0b0b12" stroke="#1f1f30" stroke-width="1.5" />

  <!-- scrolling cards (clipped to the bar) -->
  <g clip-path="url(#tk-clip)">
    <g transform="translate(166,0)" id="slot=track vw=1760" />
    <rect x="1830" y="5.5" width="78" height="69" fill="url(#tk-fade-r)" />
  </g>

  <!-- RESULTS badge (drawn over the bar's left edge) -->
  <rect x="0" y="4" width="150" height="72" rx="12" fill="#E60012" />
  <rect x="120" y="4" width="30" height="72" fill="#E60012" />
  <rect x="148" y="4" width="2" height="72" fill="rgba(0,0,0,0.3)" />
  <text x="75" y="47" text-anchor="middle" fill="#ffffff" font-family="Rajdhani" font-size="18" font-weight="700" letter-spacing="2.5">RESULTS</text>

  <!-- prototype game card (hidden; cloned + bound by the mount) -->
  <g opacity="0" id="slot=card-template w=340">
    <rect x="0" y="12" width="340" height="56" rx="10" fill="#10101a" stroke="#1f1f30" stroke-width="1" id="part=card-bg" />

    <image x="10" y="17" width="28" height="28" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="part=away-cap" />
    <text x="44" y="39" font-size="17" font-weight="700" fill="#f5f5f8" font-family="Rajdhani" id="part=away-name maxw=98">Away</text>

    <g id="part=score-group">
      <rect x="146" y="20" width="48" height="26" rx="6" fill="rgba(0,0,0,0.4)" />
      <text x="166" y="39" text-anchor="end" font-size="16" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="part=score-away">0</text>
      <text x="170" y="38" text-anchor="middle" font-size="12" fill="#8f8fa3" font-family="Inter">–</text>
      <text x="174" y="39" text-anchor="start" font-size="16" font-weight="700" style="font-variant-numeric:tabular-nums" fill="#f5f5f8" font-family="Chivo Mono" id="part=score-home">0</text>
    </g>
    <text x="170" y="38" text-anchor="middle" font-family="Rajdhani" font-size="12" font-weight="700" letter-spacing="1.5" opacity="0" fill="#8f8fa3" id="part=vs">VS</text>

    <text x="296" y="39" text-anchor="end" font-size="17" font-weight="700" fill="#f5f5f8" font-family="Rajdhani" id="part=home-name maxw=98">Home</text>
    <image x="302" y="17" width="28" height="28" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="part=home-cap" />

    <text x="170" y="62" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="0.7" fill="#8f8fa3" font-family="Inter" id="part=meta maxw=310">STADIUM · DATE</text>
  </g>
</svg>