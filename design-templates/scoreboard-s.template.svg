<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 156" preserveAspectRatio="xMidYMid meet" data-layout="absolute">
  <!--
    FIGMA REIMPORT TEMPLATE - scoreboard-s (388x156). GENERATED by
    scripts/figma-template.py from the shipped public/design/default/scoreboard-s.svg.
    Do not hand-edit this file; edit it in Figma, or regenerate it.

    Round trip: import this into Figma, restyle, export as SVG (layer names as
    ids, text NOT outlined, frame kept at exactly 388x156), then run
    scripts/compile-theme.py on the export to get an installable theme back.

    LAYER NAMES ARE THE CONTRACT. Figma keeps names, not attributes, so every
    binding the app needs rides in the layer name:
      slot=NAME            a data slot the app fills
      slot=NAME maxw=N     text that auto shrinks past N units
      part=NAME            a styling part the mount recolours
      tpl=NAME w=N         a prototype the mount clones per row
      scaffold=NAME        editing only guide (dashed boxes), STRIPPED on compile
      layout=absolute      invisible marker carrying the root layout mode
    Keep them. Rename freely otherwise.

    RUNTIME SEAM COLOURS keep these literal hues on their layers; the compiler
    maps them back to live vars, so they repaint per controller port and per the
    producer's accent setting:
      #E53935 = side 1    #1E88E5 = side 2    #E60012 = producer accent
    Every other colour here is a fixed part of the look and is yours.

    Motion lives in the mount (JS), never in the theme file.

    Dashed boxes mark image slots (team logos, character icons). PRSH ships no
    game art, so design the BOX as the no art look; the app draws the real icon
    on top and hides it when there is none.
    --><rect id="layout=absolute" x="0" y="0" width="1" height="1" opacity="0" /><!--
    DEFAULT package - Scoreboard S (388x128): a vertical two-row card (side 1 over
    side 2), all Inter, HORIZONTAL-MELD absolute layout. The core (names + scores)
    is always shown; two segments toggle independently and card-bg melds its WIDTH
    to fit whichever are visible (each segment declares data-cardw = the card width
    when it is the rightmost-visible; card-bg declares data-compact-w = collapsed):
      row-inning  the inning number (arrows), swapping to final-badge on a
                  completed game. Producer toggle overlays.scoreboard.showInning.
      row-live    the live cluster (count + base diamond). Shows during play,
                  collapses on completion. Producer master overlays.scoreboard.showLive.
    Both segments carry data-anim expand-right (wipe open left to right on show,
    collapse inward on hide). side1 / side2 / accent are runtime colour seams the
    mount repaints per controller port + producer accent (literal fallbacks keep
    the departure palette when unset). Faithful translation of the designer export
    (design-sources/default/exports/scoreboard-s.svg) — positions are the author's.
  -->
  <defs>
    <linearGradient id="sbs-w1" x1="17" y1="10" x2="187" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-opacity="0.2" stop-color="#E53935" />
      <stop offset="1" stop-opacity="0" stop-color="#E53935" />
    </linearGradient>
    <linearGradient id="sbs-w2" x1="19" y1="118" x2="189" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-opacity="0.2" stop-color="#1E88E5" />
      <stop offset="1" stop-opacity="0" stop-color="#1E88E5" />
    </linearGradient>
  </defs>

  <rect x="8" width="380" height="128" rx="20" fill="#0B0B12" id="slot=card-bg compactw=224" />
  <rect width="6" height="128" rx="3" fill="#E60012" id="slot=card-rail" />

  <!-- ░░ CORE side 1 (always shown) ░░ -->
  <g id="slot=row-top">
    <path d="M179 10H25C20.5817 10 17 13.5817 17 18V50C17 54.4183 20.5817 58 25 58H179C183.418 58 187 54.4183 187 50V18C187 13.5817 183.418 10 179 10Z" fill="url(#sbs-w1)" />
    <path opacity="0.85" d="M21 12C21 10.8954 20.1046 10 19 10C17.8954 10 17 10.8954 17 12V56C17 57.1046 17.8954 58 19 58C20.1046 58 21 57.1046 21 56V12Z" fill="#E53935" />
    <rect id="scaffold=s1-logo" x="29" y="13" width="38" height="38" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="29" y="13" width="38" height="38" preserveAspectRatio="xMidYMid meet" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=s1-logo" />
    <text x="75" y="42.27" fill="#F5F5F8" font-family="Inter" font-size="20" font-weight="bold" id="slot=s1-name maxw=108">Player One</text>
    <text x="223.63" y="46.14" text-anchor="end" fill="#F5F5F8" font-family="Inter" font-size="32" font-weight="bold" id="slot=s1-score maxw=44">0</text>
  </g>

  <!-- ░░ CORE side 2 (always shown) ░░ -->
  <g id="slot=row-bottom">
    <path d="M181 118L27 118C22.5817 118 19 114.418 19 110L19 78C19 73.5817 22.5817 70 27 70L181 70C185.418 70 189 73.5817 189 78V110C189 114.418 185.418 118 181 118Z" fill="url(#sbs-w2)" />
    <path opacity="0.85" d="M21 72C21 70.8954 20.1046 70 19 70C17.8954 70 17 70.8954 17 72V116C17 117.105 17.8954 118 19 118C20.1046 118 21 117.105 21 116V72Z" fill="#1E88E5" />
    <rect id="scaffold=s2-logo" x="29" y="75" width="38" height="38" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#8F8FA3" stroke-opacity="0.4" stroke-dasharray="3 3" /><image x="29" y="75" width="38" height="38" preserveAspectRatio="xMidYMid meet" opacity="0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" id="slot=s2-logo" />
    <text x="75" y="102.27" fill="#F5F5F8" font-family="Inter" font-size="20" font-weight="bold" id="slot=s2-name maxw=108">Player Two</text>
    <text x="223.63" y="106.14" text-anchor="end" fill="#F5F5F8" font-family="Inter" font-size="32" font-weight="bold" id="slot=s2-score maxw=44">0</text>
  </g>

  <!-- ░░ GAME MODE band (toggle + content) — melds card to 156 tall ░░
       A real bottom section: data-cardh grows card-bg (and the rail with it)
       from the compact 128 to 156 when the band shows, and collapses back when
       the producer switches it off or the mode is unknown. Left-aligned to the
       plates above rather than centred on the card, because the card's WIDTH
       melds underneath it — a centred label would slide sideways every time the
       live cluster opened. -->
  <g id="slot=row-mode">
    <rect x="17" y="126" width="4" height="16" rx="2" opacity="0.85" fill="#E60012" />
    <text x="29" y="139" fill="#F5F5F8" fill-opacity="0.62" font-family="Inter" font-size="12" font-weight="600" letter-spacing="0.4" id="slot=meta-game-mode maxw=176">Game Mode</text>
  </g>

  <!-- ░░ INNING segment (toggle) — melds card to 292 ░░ -->
  <g id="slot=row-inning anim=expand-right cardw=292">
    <text x="250.883" y="81.45" fill="#F5F5F8" font-family="Inter" font-size="48" font-weight="bold" id="slot=inn-num">1</text>
    <g id="slot=inn-arrow-up"><path d="M250 37H282L266 19L250 37Z" fill="#E60012" /></g>
    <g opacity="0" id="slot=inn-arrow-down"><path d="M250 91H282L266 109L250 91Z" fill="#E60012" /></g>
    <g opacity="0" id="slot=final-badge">
      <path d="M287.31 51H243.69C240.547 51 238 53.6863 238 57V71C238 74.3137 240.547 77 243.69 77H287.31C290.453 77 293 74.3137 293 71V57C293 53.6863 290.453 51 287.31 51Z" fill="#E60012" />
      <text x="245.088" y="69.59" fill="#FFFFFF" font-family="Inter" font-size="14" font-weight="bold">FINAL</text>
    </g>
  </g>

  <!-- ░░ LIVE segment (toggle + game-state) — melds card to full 380 ░░ -->
  <g id="slot=row-live anim=expand-right cardw=380">
    <text x="319.238" y="111.23" fill="#F5F5F8" font-family="Inter" font-size="24" font-weight="bold" id="slot=balls">0</text>
    <text x="336.75" y="110.23" fill="#F5F5F8" font-family="Inter" font-size="24" font-weight="bold">-</text>
    <text x="349.238" y="111.23" fill="#F5F5F8" font-family="Inter" font-size="24" font-weight="bold" id="slot=strikes">0</text>
    <path d="M331.5 82C335.09 82 338 79.0899 338 75.5C338 71.9101 335.09 69 331.5 69C327.91 69 325 71.9101 325 75.5C325 79.0899 327.91 82 331.5 82Z" fill="rgba(255,255,255,0.08)" id="slot=out-0" />
    <path d="M352.5 82C356.09 82 359 79.0899 359 75.5C359 71.9101 356.09 69 352.5 69C348.91 69 346 71.9101 346 75.5C346 79.0899 348.91 82 352.5 82Z" fill="rgba(255,255,255,0.08)" id="slot=out-1" />
    <rect x="306" y="45.9706" width="24" height="24" transform="rotate(-45 306 45.9706)" fill="rgba(255,255,255,0.08)" id="slot=base-3" />
    <rect x="325" y="26.9706" width="24" height="24" transform="rotate(-45 325 26.9706)" fill="rgba(255,255,255,0.08)" id="slot=base-2" />
    <rect x="344" y="45.9706" width="24" height="24" transform="rotate(-45 344 45.9706)" fill="rgba(255,255,255,0.08)" id="slot=base-1" />
  </g>
</svg>